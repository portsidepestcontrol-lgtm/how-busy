function loadExtraVenuesAfterRender(){
  setTimeout(()=>{
    try{
      const existingNames=new Set(V.map(v=>String(v.n).trim().toLowerCase()));
      for(const x of extraVenues){
        const name=String(x[0]).trim().toLowerCase();
        if(!name || existingNames.has(name)) continue;
        V.push({id:V.length,n:x[0],t:x[1],s:x[2],a:x[3],r:venueRegion(x)});
        existingNames.add(name);
      }
      extraVenuesLoaded=true;
      /* Refresh only if the home screen is currently visible. */
      if(document.getElementById("venueResults")) home();

      console.warn("Additional venue dataset failed to load; base venues remain available",e);

async function loadWhosOutFromSupabase(venueId){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return null;
  try{
    const url=SUPABASE_URL+
      "/rest/v1/venue_whos_out"+
      "?select=venue_id,total_reports,men_reports,women_reports,mixed_reports,who_out_label,men_percent,women_percent,mixed_percent"+
      "&venue_id=eq."+encodeURIComponent(Number(venueId))+"&limit=1";
    const r=await fetchWithTimeout(url,{
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":"Bearer "+SUPABASE_ANON_KEY
      }
    },8000);
    if(!r.ok){
      console.error("Who's Out view error",r.status,await r.text());
      return null;
    }
    const rows=await r.json();
    if(!rows || !rows.length) return null;
    const row=rows[0];
    return {
      total:Number(row.total_reports)||0,
      male:Number(row.men_reports)||0,
      female:Number(row.women_reports)||0,
      mixed:Number(row.mixed_reports)||0,
      menPercent:Number(row.men_percent)||0,

/* Privacy-first activity signal:
   - location sharing is explicitly opt-in
   - coordinates are rounded before upload
   - raw device coordinates are never sent to Supabase
   - presence expires automatically in the database
*/
function coarseLocation(lat,lon){
  return {
    lat: Math.round(Number(lat)*1000)/1000,
    lon: Math.round(Number(lon)*1000)/1000
  };
}
async function sendActivityPresence(position,venueId=null){
  if(!activityEnabled || !position || !position.coords)return false;
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY)return false;
  const c=coarseLocation(position.coords.latitude,position.coords.longitude);
  try{
    const r=await fetchWithTimeout(SUPABASE_URL+"/rest/v1/activity_presence",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify({
        session_id:activitySession,
        lat:c.lat,
        lon:c.lon,
        expires_at:new Date(Date.now()+15*60*1000).toISOString(),
        venue_id: venueId==null ? null : Number(venueId)
      })
    },8000);
    if(!r.ok){console.error("Activity presence error",r.status,await r.text());return false}
    return true;
  }catch(e){
    console.error("Activity presence connection error",e);
    return false;
  }
}
function updateActivityVenue(venueId){
  activeVenueId = venueId == null ? null : Number(venueId);
  if(!activityEnabled || !navigator.geolocation || activeVenueId == null)return;
  navigator.geolocation.getCurrentPosition(
    async p=>{ await sendActivityPresence(p,activeVenueId); },
    ()=>{},
    {enableHighAccuracy:false,maximumAge:120000,timeout:8000}
  );
}
function activityTick(){
  if(!activityEnabled)return;
  if(!navigator.geolocation){toast("Location is not supported on this device");return}
  navigator.geolocation.getCurrentPosition(

function safeJSON(value,fallback){try{return value?JSON.parse(value):fallback}catch(e){return fallback}}
function esc(value){return String(value).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

/* Old versions of the app accidentally saved queue choices as crowd reports.
   These three values (10/50/85) with a Moderate crowd label identify those old
   queue-only rows. They are ignored when calculating live crowd levels. */
function isBadLegacyQueueRow(r){
  const p=Number(r.crowd_percent);
  return String(r.crowd_label)==="Moderate" && (p===10 || p===50 || p===85) && QUEUE_LABELS.has(String(r.queue_label));

function fetchWithTimeout(url,options={},ms=8000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  return fetch(url,{...options,signal:controller.signal}).finally(()=>clearTimeout(timer));
}

/* Load all recent reports once, rather than making one Supabase request per venue. */
async function refreshCloudReports(force=false){
  const now=Date.now();
  if(!force && cloudLoadedAt && now-cloudLoadedAt<15000)return cloudRows;
  if(cloudPromise)return cloudPromise;
  cloudPromise=(async()=>{
    try{
      const since=new Date(Date.now()-7200000).toISOString();
      const u=SUPABASE_URL+"/rest/v1/venue_reports?created_at=gte."+encodeURIComponent(since)+
        "&select=venue_id,crowd_percent,crowd_label,queue_label,created_at&order=created_at.desc&limit=1000";
      const r=await fetchWithTimeout(u,{headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY}});
      if(!r.ok){
        const text=await r.text();
        console.error("Supabase live reports error",r.status,text);
        return cloudRows;
      }
      cloudRows=validCloudCrowdRows(await r.json());
      cloudLoadedAt=Date.now();
      return cloudRows;
    }catch(e){
      console.error("Supabase live reports connection error",e);
      return cloudRows;
    }finally{cloudPromise=null}
  })();
  return cloudPromise;
}

function localLive(v){
  const r=(reports[v.id]||[]).filter(x=>Date.now()-Number(x.t)<7200000 && Number.isFinite(Number(x.p)));
  if(!r.length)return null;
  const p=Math.round(r.reduce((a,b)=>a+Number(b.p),0)/r.length);
  return {p,l:crowdLabel(p),n:r.length,source:"local"};
}
function cloudLive(v){
  const r=cloudRows.filter(x=>Number(x.venue_id)===Number(v.id));
  if(!r.length)return null;
  const p=Math.round(r.reduce((a,b)=>a+Number(b.crowd_percent),0)/r.length);
  return {p,l:crowdLabel(p),n:r.length,source:"cloud"};
}
function live(v){return cloudLive(v)||localLive(v)}

<script>
(function(){
  window.HowBusyLive = {
    classify:function(score){
      if(score == null || !isFinite(score)) return ['—','No live rating'];
      if(score < 25) return ['🟢','Quiet'];
      if(score < 50) return ['🟡','Moderate'];
      if(score < 75) return ['🟠','Busy'];
      return ['🔴','Very busy'];
    },
    combine:function(reportScore, nearby, historical){
      const parts=[];
      if(Number.isFinite(reportScore)) parts.push({v:reportScore,w:0.5});
      if(Number.isFinite(historical)) parts.push({v:historical,w:0.3});
      if(Number.isFinite(nearby)) parts.push({v:Math.min(100, nearby*5),w:0.2});
      if(!parts.length) return null;
      const total=parts.reduce((a,x)=>a+x.w,0);
      return parts.reduce((a,x)=>a+x.v*x.w,0)/total;
    },
    render:function(el, data){
      if(!el) return;
      const score=this.combine(data.reportScore,data.nearby,data.historical);
      const c=this.classify(score);
      el.innerHTML='<div style="border:1px solid #ddd;border-radius:14px;padding:14px;margin:12px 0;background:#fff">'+
        '<div style="font-size:12px;font-weight:700;letter-spacing:.08em;color:#666">LIVE BUSY INDICATOR</div>'+
        '<div style="font-size:26px;font-weight:800;margin-top:4px">'+c[0]+' '+c[1]+'</div>'+ 
        '<div style="font-size:13px;color:#666;margin-top:6px">Combined from current reports, anonymous nearby activity and historical patterns.</div>'+ 
        '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px">'+
        '<span>Reports: '+(Number.isFinite(data.reportScore)?Math.round(data.reportScore)+'%':'—')+'</span>'+ 
        '<span>Nearby: '+(Number.isFinite(data.nearby)?Math.round(data.nearby):'—')+'</span>'+ 
        '<span>Typical: '+(Number.isFinite(data.historical)?Math.round(data.historical)+'%':'—')+'</span></div></div>';
    }
  };
})();
</script>

<script>
/* How Busy? Live Presence v1
   Keeps anonymous live activity separate from historical reports.
   Presence is considered live for 15 minutes after the last activity update.
   When the user leaves/stops sharing, their live activity stops contributing;
   completed crowd reports remain in history.
*/
(function(){
  const PRESENCE_TTL_MS = 15 * 60 * 1000;
  window.HB_LIVE_PRESENCE = {
    ttlMs: PRESENCE_TTL_MS,
    isActive: function(lastSeenMs, nowMs) {
      return Number.isFinite(lastSeenMs) && (nowMs - lastSeenMs) <= PRESENCE_TTL_MS;
    },
    statusText: function(lastSeenMs, nowMs) {
      return this.isActive(lastSeenMs, nowMs) ? "Live nearby activity" : "No live activity";
    }
  };

  // Do not alter stored reports. Only live-presence records expire.
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden") {
      window.dispatchEvent(new CustomEvent("howbusy:presence-paused"));
    } else {
      window.dispatchEvent(new CustomEvent("howbusy:presence-resumed"));
    }
  });
})();
</script>


<script>
/* How Busy? Best Time To Go v1
   Uses historical crowd reports already stored by the app.
   It never invents a recommendation when there is insufficient history.
*/
(function(){
  window.HB_BEST_TIME = {
    minReports: 5,
    bucketMinutes: 60,

    getBucket: function(date){
      const d = date instanceof Date ? date : new Date(date);
      return d.getDay() + "-" + String(d.getHours()).padStart(2,"0");
    },

    build: function(reports, now){
      const current = now instanceof Date ? now : new Date(now || Date.now());
      const day = current.getDay();
      const buckets = {};

      (reports || []).forEach(r => {
        const ts = r.created_at || r.timestamp || r.reported_at || r.time;
        const d = new Date(ts);
        if (isNaN(d)) return;
        if (d.getDay() !== day) return;

        const level = Number(r.crowd_level ?? r.crowd ?? r.busyness ?? r.score);
        if (!Number.isFinite(level)) return;

        const key = d.getHours();
        if (!buckets[key]) buckets[key] = [];
        buckets[key].push(level);
      });

      const rows = Object.keys(buckets).map(h => {
        const vals = buckets[h];
        const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
        return {hour:Number(h), avg, count:vals.length};
      }).filter(x => x.count >= 1);

      if (rows.length < 1) return {ready:false, message:"Building your venue's best-time history."};

      rows.sort((a,b)=>a.avg-b.avg);
      const quiet = rows[0];
      const busy = rows[rows.length-1];

      const fmt = h => {
        const suffix = h >= 12 ? "PM" : "AM";
        const hh = h % 12 || 12;
        return hh + " " + suffix;
      };

      return {
        ready: rows.some(x=>x.count >= this.minReports),
        quiet: fmt(quiet.hour),
        busy: fmt(busy.hour),
        quietAvg: Math.round(quiet.avg),
        busyAvg: Math.round(busy.avg),
        quietCount: quiet.count,
        busyCount: busy.count,
        message: rows.some(x=>x.count >= this.minReports)
          ? "Based on your venue's historical reports for this day of the week."
          : "Building your venue's best-time history — more reports will improve it."
      };
    }
  };
})();
</script>

<script>
/* How Busy? Tonight Timeline v1
   Builds an hour-by-hour view from historical reports for today's weekday.
   Insufficient history is shown honestly rather than inferred.
*/
(function(){
  window.HB_TONIGHT = {
    minReportsPerHour: 2,

    build: function(reports, now){
      const current = now instanceof Date ? now : new Date(now || Date.now());
      const day = current.getDay();
      const currentHour = current.getHours();
      const buckets = {};

      (reports || []).forEach(r => {
        const ts = r.created_at || r.timestamp || r.reported_at || r.time;
        const d = new Date(ts);
        if (isNaN(d) || d.getDay() !== day) return;
        const level = Number(r.crowd_level ?? r.crowd ?? r.busyness ?? r.score);
        if (!Number.isFinite(level)) return;

        const h = d.getHours();
        if (!buckets[h]) buckets[h] = [];
        buckets[h].push(level);
      });

      const timeline = [];
      for (let h = Math.max(currentHour, 17); h <= 23; h++) {
        const vals = buckets[h] || [];
        const enough = vals.length >= this.minReportsPerHour;
        const avg = enough ? vals.reduce((a,b)=>a+b,0)/vals.length : null;

        let label = "Building data";
        let icon = "⚪";
        if (avg !== null) {
          if (avg >= 8) { label = "Packed"; icon = "🔴"; }
          else if (avg >= 6) { label = "Busy"; icon = "🟠"; }
          else if (avg >= 3) { label = "Moderate"; icon = "🟡"; }
          else { label = "Quiet"; icon = "🟢"; }
        }

        timeline.push({
          hour:h, avg, count:vals.length, enough, label, icon,
          time:(h % 12 || 12) + (h >= 12 ? "pm" : "am")
        });
      }

      return timeline;
    }
  };
})();
</script>
