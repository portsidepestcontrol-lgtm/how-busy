<script>
const root=document.getElementById('root');

const SUPABASE_URL = "https://muabpzculmygamxanqzq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_fWxLAiiN658fOlsCdiCZpQ_UFfIaJua";

function hbDeviceId(){
  let id=localStorage.getItem("hb_device_id");
  if(!id){
    if(window.crypto && crypto.randomUUID) id=crypto.randomUUID();
    else id="hb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    localStorage.setItem("hb_device_id",id);
  }
  return id;
}

async function supabaseRequest(path, options={}){
  const headers=Object.assign({
    "apikey":SUPABASE_ANON_KEY,
    "Authorization":"Bearer "+SUPABASE_ANON_KEY,
    "Content-Type":"application/json"
  }, options.headers||{});
  const res=await fetch(SUPABASE_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();
  let data=null;
  try{ data=text?JSON.parse(text):null; }catch(e){ data=text; }
  if(!res.ok) throw new Error((data&&data.message)||"Supabase error "+res.status);
  return data;
}

function backendStatus(message, ok=true){
  const old=document.getElementById("backend-status");
  if(old) old.remove();
  const el=document.createElement("div");
  el.id="backend-status";
  el.className="backend-status "+(ok?"ok":"bad");
  el.textContent=message;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

async function saveProfileToSupabase(){
  const relationship=localStorage.getItem("hbRelationship")||null;
  const gender=localStorage.getItem("hbGender")||null;
  if(!relationship && !gender){
    backendStatus("Choose Single/Taken or Male/Female first.",false);
    return;
  }
  try{
    await supabaseRequest("/rest/v1/rpc/save_hb_profile", {
      method:"POST",
      body:JSON.stringify({
        p_device_id:hbDeviceId(),
        p_relationship_status:relationship,
        p_gender:gender
      })
    });
    backendStatus("✓ Profile answer saved");
  }catch(e){
    console.error("Profile save failed",e);
    backendStatus("Server save failed: "+(e.message||"unknown error"),false);
  }
}

async function submitCrowdAnswerToSupabase(venueId, answer){
  try{
    await supabaseRequest("/rest/v1/rpc/submit_hb_crowd_report", {
      method:"POST",
      body:JSON.stringify({
        p_device_id:hbDeviceId(),
        p_venue_id:String(venueId),
        p_crowd_mix:answer
      })
    });
    backendStatus("✓ Crowd answer sent");
    return true;
  }catch(e){
    console.error("Crowd report failed",e);
    backendStatus("Crowd upload failed: "+(e.message||"unknown error"),false);
    return false;
  }
}

/* =========================================================
   HOW BUSY? — V27 — 50 METRE VENUE GEOFENCE ENGINE
   - Standard radius: 50m for every participating venue.
   - The nearest mapped venue wins when multiple 50m circles overlap.
   - Coordinates are resolved from each venue address and cached locally.
   - The phone performs the geofence calculation locally.
   - Presence uploads contain only anonymous device + venue + expiry data;
     raw GPS coordinates are NOT uploaded.
========================================================= */
const HB_GEOFENCE_RADIUS_METRES = 50;
const HB_CLOSE_VENUE_RADIUS_METRES = 0;
const HB_CLOSE_MIN_RADIUS_METRES = 50;
const HB_CLOSE_MAX_RADIUS_METRES = 50;
let hbGpsWatchId = null;
let hbGpsRunning = false;
let hbCurrentVenueId = null;
let hbLastGps = null;
let hbGeocodeRunning = false;
let hbPresenceTimer = null;

function hbDistanceMetres(lat1,lon1,lat2,lon2){
  const R=6371000;
  const p1=Number(lat1)*Math.PI/180, p2=Number(lat2)*Math.PI/180;
  const dLat=(Number(lat2)-Number(lat1))*Math.PI/180;
  const dLon=(Number(lon2)-Number(lon1))*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function hbClamp(n,min,max){ return Math.max(min,Math.min(max,n)); }

function hbVenueRadius(v){
  return HB_GEOFENCE_RADIUS_METRES;
}

function hbLoadVenueCoordinates(){
  venues.forEach(v=>{
    try{
      const staticC=HB_STATIC_COORDS[v.id];
      if(staticC){
        v.lat=Number(staticC[0]);
        v.lon=Number(staticC[1]);
        v.verified=true;
        v.radius=50;
        return;
      }
      if(v.id==='sunnyside-tavern'){
        v.lat=-32.91433;
        v.lon=151.73247;
        v.verified=true;
        v.radius=50;
        return;
      }
      const cached=localStorage.getItem('hbVenueCoords:'+v.id);
      if(cached){
        const c=JSON.parse(cached);
        if(Number.isFinite(Number(c.lat)) && Number.isFinite(Number(c.lon))){
          v.lat=Number(c.lat);
          v.lon=Number(c.lon);
          v.verified=true;
          v.radius=50;
        }
      }
    }catch(e){}
  });
}

function hbSaveVenueCoordinates(v,lat,lon){
  v.lat=Number(lat); v.lon=Number(lon); v.verified=true;
  v.radius=hbVenueRadius(v);
  try{localStorage.setItem('hbVenueCoords:'+v.id,JSON.stringify({lat:v.lat,lon:v.lon,verified:true}));}catch(e){}
}

async function hbGeocodeVenue(v){
  if(!v || !v.address || (Number.isFinite(Number(v.lat))&&Number.isFinite(Number(v.lon)))) return true;
  const queries=[
    v.address+', Australia',
    v.name+', '+v.address+', Australia',
    v.name+', '+String(v.address||'')
  ];

  // 1) ArcGIS World Geocoder — strong street-address coverage.
  for(const raw of queries){
    try{
      const q=encodeURIComponent(raw);
      const url='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?SingleLine='+q+'&f=json&maxLocations=1';
      const r=await fetch(url,{headers:{'Accept':'application/json'}});
      if(r.ok){
        const j=await r.json();
        const a=j && j.candidates && j.candidates[0];
        if(a && a.location && Number.isFinite(Number(a.location.y)) && Number.isFinite(Number(a.location.x))){
          hbSaveVenueCoordinates(v,a.location.y,a.location.x);
          return true;
        }
      }
    }catch(e){}
  }

  // 2) Photon fallback.
  for(const raw of queries){
    try{
      const q=encodeURIComponent(raw);
      const r=await fetch('https://photon.komoot.io/api/?q='+q+'&limit=1',{headers:{'Accept':'application/json'}});
      if(r.ok){
        const j=await r.json();
        const f=j && j.features && j.features[0];
        const c=f && f.geometry && f.geometry.coordinates;
        if(c && c.length>=2 && Number.isFinite(Number(c[0])) && Number.isFinite(Number(c[1]))){
          hbSaveVenueCoordinates(v,c[1],c[0]);
          return true;
        }
      }
    }catch(e){}
  }

  // 3) OpenStreetMap Nominatim fallback. Keep this sequential to respect public-service limits.
  for(const raw of queries){
    try{
      const q=encodeURIComponent(raw);
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+q,{headers:{'Accept':'application/json','Accept-Language':'en-AU'}});
      if(r.ok){
        const j=await r.json();
        const a=j && j[0];
        if(a && Number.isFinite(Number(a.lat)) && Number.isFinite(Number(a.lon))){
          hbSaveVenueCoordinates(v,Number(a.lat),Number(a.lon));
          return true;
        }
      }
    }catch(e){}
  }
  return false;
}

function hbNormVenueName(s){
  return String(s||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim().replace(/\b(the|hotel|pub|bar|club|newcastle|nsw)\b/g,' ').replace(/\s+/g,' ').trim();
}
async function hbMapFromOpenStreetMap(){
  try{
    const q='[out:json][timeout:25];(nwr[\"name\"][\"amenity\"~\"pub|bar|nightclub|brewery|social_centre|community_centre|restaurant\"](-33.2,151.45,-32.75,151.9);nwr[\"name\"][\"leisure\"~\"dance|sports_centre|stadium\"](-33.2,151.45,-32.75,151.9););out center tags;';
    const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
    if(!r.ok)return 0;
    const j=await r.json();
    const rows=(j&&j.elements)||[];
    let hits=0;
    const byName=new Map();
    rows.forEach(e=>{const n=hbNormVenueName(e.tags&&e.tags.name); if(!n)return; const lat=e.lat!=null?e.lat:(e.center&&e.center.lat), lon=e.lon!=null?e.lon:(e.center&&e.center.lon); if(Number.isFinite(Number(lat))&&Number.isFinite(Number(lon))){byName.set(n,{lat:Number(lat),lon:Number(lon)})}});
    venues.forEach(v=>{
      if(Number.isFinite(Number(v.lat))&&Number.isFinite(Number(v.lon)))return;
      const key=hbNormVenueName(v.name);
      const c=byName.get(key);
      if(c){hbSaveVenueCoordinates(v,c.lat,c.lon);hits++;}
    });
    return hits;
  }catch(e){console.warn('OSM venue sweep failed',e);return 0;}
}

async function hbGeocodeAllVenues(){
  if(hbGeocodeRunning)return;
  hbGeocodeRunning=true;
  hbSetGpsStatus('Venue database: mapping all venues…');
  // First use one local OSM sweep instead of making 100+ individual requests.
  await hbMapFromOpenStreetMap();
  let done=venues.filter(v=>Number.isFinite(Number(v.lat))&&Number.isFinite(Number(v.lon))).length;
  hbSetGpsStatus('Venue database: '+done+'/'+venues.length+' mapped · resolving remaining');
  hbRenderNearbyVenues();
  try{if(typeof renderNewcastleVenues==='function' && selectedCity==='Newcastle')renderNewcastleVenues();}catch(e){}

  // Resolve the remaining exact street addresses in parallel. The old build used one worker,
  // which made a full Newcastle sweep take many minutes and caused mobile browsers to time out.
  const queue=venues.filter(v=>!Number.isFinite(Number(v.lat))||!Number.isFinite(Number(v.lon)));
  const workers=Math.min(6,Math.max(2,queue.length));
  async function worker(){
    while(queue.length){
      const v=queue.shift(); if(!v)return;
      await hbGeocodeVenue(v);
      done++;
      if(done%3===0){hbRenderNearbyVenues();try{if(typeof renderNewcastleVenues==='function'&&selectedCity==='Newcastle')renderNewcastleVenues();}catch(e){}}
      hbSetGpsStatus('Venue database: '+Math.min(done,venues.length)+'/'+venues.length+' mapped');
      await new Promise(r=>setTimeout(r,220));
    }
  }
  await Promise.all(Array.from({length:workers},worker));

  // Final retry with the venue name included, useful for POIs whose street address is not indexed.
  const retry=venues.filter(v=>!Number.isFinite(Number(v.lat))||!Number.isFinite(Number(v.lon)));
  for(const v of retry){
    const original=v.address;
    try{
      const q=encodeURIComponent(v.name+', '+original+', Australia');
      const r=await fetch('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?SingleLine='+q+'&f=json&maxLocations=1',{headers:{'Accept':'application/json'}});
      if(r.ok){const j=await r.json(),a=j&&j.candidates&&j.candidates[0];if(a&&a.location&&Number.isFinite(Number(a.location.y))&&Number.isFinite(Number(a.location.x)))hbSaveVenueCoordinates(v,a.location.y,a.location.x);}
    }catch(e){}
    await new Promise(r=>setTimeout(r,250));
  }

  venues.forEach(v=>{if(Number.isFinite(Number(v.lat))&&Number.isFinite(Number(v.lon))){v.radius=50;v.verified=true;}});
  hbGeocodeRunning=false;
  const mapped=venues.filter(v=>Number.isFinite(Number(v.lat))&&Number.isFinite(Number(v.lon))).length;
  const missing=venues.length-mapped;
  hbSetGpsStatus(missing ? 'Venue database: '+mapped+'/'+venues.length+' mapped · '+missing+' need manual verification' : 'Venue database: '+venues.length+'/'+venues.length+' venues mapped · 50m geofence');
  hbRenderNearbyVenues();
  try{if(typeof renderNewcastleVenues==='function'&&selectedCity==='Newcastle')renderNewcastleVenues();}catch(e){}
}
function hbFindVenue(lat,lon){
  let nearest=null, nearestDistance=Infinity;
  for(const v of venues){
    if(!Number.isFinite(Number(v.lat))||!Number.isFinite(Number(v.lon)))continue;
    const radius=hbVenueRadius(v);
    v.radius=radius;
    const d=hbDistanceMetres(lat,lon,v.lat,v.lon);
    if(d<=radius && d<nearestDistance){ nearest={venue:v,distance:d,radius}; nearestDistance=d; }
  }
  return nearest;
}

async function hbRecordPresence(venueId){
  if(!venueId) return {ok:false,stage:'venue',error:'Missing venue id'};
  const deviceId=hbDeviceId();
  const result={ok:false,deviceId,venueId:String(venueId),rpc:null,activity:null,error:null};

  // Single authoritative path for the new venue-presence table.
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/record_hb_presence',{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_device_id:deviceId,p_venue_id:String(venueId)})
    });
    const body=await r.text();
    if(r.ok){ result.rpc={ok:true,status:r.status}; result.ok=true; }
    else { result.rpc={ok:false,status:r.status,body}; result.error='Supabase RPC rejected the presence: HTTP '+r.status+(body?' · '+body:''); }
  }catch(e){
    result.rpc={ok:false,error:String(e&&e.message||e)};
    result.error='Could not reach Supabase RPC: '+(e&&e.message||e);
  }

  // Compatibility write is retained so existing activity analytics can also see the venue.
  if(hbLastGps && Number.isFinite(hbLastGps.lat) && Number.isFinite(hbLastGps.lon)){
    try{
      const lat=Math.round(hbLastGps.lat*1000)/1000;
      const lon=Math.round(hbLastGps.lon*1000)/1000;
      const r2=await fetch(SUPABASE_URL+'/rest/v1/activity_presence',{
        method:'POST',
        headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({session_id:deviceId,lat,lon,expires_at:new Date(Date.now()+15*60*1000).toISOString(),venue_id:String(venueId)})
      });
      const body2=await r2.text();
      result.activity={ok:r2.ok,status:r2.status,body:body2};
      if(r2.ok) result.ok=true;
    }catch(e){ result.activity={ok:false,error:String(e&&e.message||e)}; }
  }
  return result;
}

function hbFormatPresenceResult(result, venueName){
  if(result && result.ok) return '✓ '+venueName+' detected — presence sent to Supabase.';
  const rpc=result && result.rpc;
  if(rpc && rpc.status===404) return 'Venue detected, but Supabase does not have the record_hb_presence function. Run the geofence SQL once in Supabase.';
  if(rpc && rpc.body) return 'Venue detected, but Supabase rejected the presence: '+rpc.body;
  if(result && result.activity && result.activity.body) return 'Venue detected, but the Supabase activity upload failed: '+result.activity.body;
  return 'Venue detected, but the presence could not be sent to Supabase.';
}

async function hbRenewPresence(force=false){
  if(!hbCurrentVenueId || hbPresenceBusy)return;
  if(!force && Date.now()-hbLastPresenceSentAt < 90*1000)return;
  hbPresenceBusy=true;
  try{
    const result=await hbRecordPresence(hbCurrentVenueId);
    if(result && result.ok) hbLastPresenceSentAt=Date.now();
    await hbRefreshLiveCountsNow();

  }

function hbRenderNearbyVenues(){
  const box=document.getElementById('hbNearbyVenues');
  if(!box)return;
  if(!hbLastGps || !Number.isFinite(hbLastGps.lat) || !Number.isFinite(hbLastGps.lon)){
    box.innerHTML='<div class="muted" style="padding:18px 0">Finding your location and nearby pubs…</div>';
    return;
  }
  const nearby=[];
  for(const v of venues){
    if(!Number.isFinite(Number(v.lat))||!Number.isFinite(Number(v.lon)))continue;
    if(!/pub/i.test(String(v.type||'')))continue;
    const d=hbDistanceMetres(hbLastGps.lat,hbLastGps.lon,v.lat,v.lon);
    if(d<=10000) nearby.push({v,d});
  }
  nearby.sort((a,b)=>a.d-b.d);
  if(!nearby.length){
    box.innerHTML='<div class="muted" style="padding:18px 0">No mapped pubs found near your current location yet.</div>';
    return;
  }
  box.innerHTML=nearby.slice(0,5).map(({v,d})=>{
    // Only label a venue "AT VENUE" when this is a fresh GPS fix and the
    // calculated distance is genuinely inside the 50m production fence.
    const fresh=hbLastGps && (Date.now()-hbLastGps.at)<120000;
    const inside=fresh && d<=hbVenueRadius(v);
    const distance=d<1000?Math.round(d)+' m':(d/1000).toFixed(1)+' km';
    return `<div class="card venue" style="margin:10px 0" onclick="venue(${JSON.stringify(v.id)})">
      <div class="row"><div><b>${escapeHtmlSafe(v.name||'Venue')}</b><div class="muted small">${escapeHtmlSafe(v.type||'Pub')} · ${escapeHtmlSafe(v.address||'')}</div></div><div style="text-align:right"><b>${distance}</b><div class="muted small">${inside?'AT VENUE':'away'}</div></div></div>
    </div>`;
  }).join('');
}

function hbRenderHomeRankings(filter){
  const closeBox=document.getElementById('hbClosestPubs'), busyBox=document.getElementById('hbBusiestPubs');
  if(!closeBox||!busyBox)return;
  let mapped=venues.filter(v=>Number.isFinite(Number(v.lat))&&Number.isFinite(Number(v.lon)));
  let closest=mapped.map(v=>({v,d:hbLastGps?hbDistanceMetres(hbLastGps.lat,hbLastGps.lon,v.lat,v.lon):999999})).sort((a,b)=>a.d-b.d).slice(0,5).map(x=>x.v);
  if(!closest.length) closeBox.innerHTML='<div class="muted">We are still mapping Newcastle venues for location ranking.</div>';
  else closeBox.innerHTML=closest.map(v=>hbDetailedVenueCard(v,isPremium())).join('');
  let ranked=venues.slice().sort((a,b)=>Number(b.busy||0)-Number(a.busy||0));
  if(filter==='singles' && isPremium()) ranked.sort((a,b)=>Number(b._singlePct||0)-Number(a._singlePct||0));
  if(filter==='balance' && isPremium()) ranked.sort((a,b)=>Math.abs(50-Number(a._malePct||50))-Math.abs(50-Number(b._malePct||50)));
  const top=ranked.slice(0,5);
  busyBox.innerHTML=top.map(v=>hbDetailedVenueCard(v,isPremium())).join('');
  const total=venues.reduce((s,v)=>s+Number(v.busy||0),0);
  const busiest=ranked[0];
  const t=document.getElementById('hbTotalPeople'),bn=document.getElementById('hbBusiestName'),bc=document.getElementById('hbBusiestCount');
  if(t)t.textContent=total||'0';
  if(bn)bn.textContent=busiest?busiest.name:'—';
  if(bc)bc.textContent=busiest?(Number(busiest.busy||0)+' people'): 'Busiest venue';
  if(isPremium()){
    Promise.all(venues.slice().sort((a,b)=>Number(b.busy||0)-Number(a.busy||0)).slice(0,8).map(async v=>{const d=await loadPremiumDemographics(v.id);v._premiumData=d;if(d&&Number(d.total_active||0)>0){v._singlePct=pct(d.single_count,d.total_active);v._malePct=pct(d.male_count,d.total_active)}return v;})).then(()=>{
      const best=venues.filter(v=>Number(v._singlePct||0)>0).sort((a,b)=>b._singlePct-a._singlePct)[0];
      const el=document.getElementById('hbSinglesName'); if(el)el.textContent=best?best.name:'Collecting data';
      if(filter==='singles'||filter==='balance') hbRenderHomeRankings(filter);
      else { if(closeBox)closeBox.innerHTML=closest.map(v=>hbDetailedVenueCard(v,true)).join(''); if(busyBox)busyBox.innerHTML=top.map(v=>hbDetailedVenueCard(v,true)).join(''); }
    });
  }
}

function hbHandlePosition(position){
  const lat=Number(position.coords.latitude), lon=Number(position.coords.longitude);
  if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
  const previousVenueId=hbCurrentVenueId;
  hbLastGps={lat,lon,accuracy:Number(position.coords.accuracy)||null,at:Date.now()};
  hbRenderNearbyVenues();
  hbRenderHomeRankings();

  const hit=hbFindVenue(lat,lon);
  const newId=hit?hit.venue.id:null;

  if(newId===previousVenueId && newId){
    // Stay alive while the user remains inside the same venue. This is the
    // primary renewal path when Safari is actively delivering GPS updates.
    hbRenewPresence();
  }

  if(newId!==previousVenueId){
    hbCurrentVenueId=newId;
    try{localStorage.setItem('hbCurrentVenueId',newId||'');}catch(e){}

    // Leaving: immediately end the old venue presence and refresh counts.
    if(previousVenueId){
      hbStopPresence(previousVenueId).finally(()=>hbRefreshLiveCountsNow());
    }

    // Entering: immediately record the new venue and refresh the live rankings.
    if(hit){
      hbRecordPresence(hit.venue.id).then(result=>{
        if(result && result.ok) hbLastPresenceSentAt=Date.now();
        return hbRefreshLiveCountsNow();
      });
      hbSetGpsStatus('📍 At '+hit.venue.name+' · '+Math.round(hit.distance)+'m · '+hit.radius+'m geofence');
    }else{
      hbSetGpsStatus('📍 No participating venue within 50m');
    }
  }
}

function hbHandleGpsError(err){
  const msg=err && err.code===1?'Location permission is off.':err && err.code===2?'Location position unavailable right now.':'Location timed out — trying again.';
  hbSetGpsStatus('⚠️ '+msg);
}

async function hbTestLocationNow(){
  try{ localStorage.removeItem('hbSunnysideCalibrated'); }catch(e){}
  const out=document.getElementById('hbLocationTestResult');
  if(out) out.textContent='Testing venue detection…';
  hbLoadVenueCoordinates();
  // Venue coordinates are fixed in the build; no user calibration is used.
  if(!navigator.geolocation){
    if(out) out.textContent='Location is not available in this browser.';
    return;
  }
  navigator.geolocation.getCurrentPosition(async position=>{
    const lat=Number(position.coords.latitude), lon=Number(position.coords.longitude);
    const accuracy=Number(position.coords.accuracy)||null;
    hbHandlePosition(position);
    const hit=hbFindVenue(lat,lon);
    if(hit){
      const saved=await hbRecordPresence(hit.venue.id);
      hbCurrentVenueId=hit.venue.id;
      if(out) out.textContent=hbFormatPresenceResult(saved,hit.venue.name);
      return;
    }

    // V18 diagnostic: never show coordinates or raw GPS accuracy.
    // We only report a distance band so we can distinguish a bad venue pin
    // from an iPhone/Safari location that is too approximate for a 50m fence.
    let nearest=null;
    for(const v of venues){
      if(!Number.isFinite(Number(v.lat))||!Number.isFinite(Number(v.lon)))continue;
      const d=hbDistanceMetres(lat,lon,v.lat,v.lon);
      if(!nearest || d<nearest.distance) nearest={venue:v,distance:d};
    }

    if(accuracy && accuracy>25){
      if(out) out.textContent='Your phone is returning an approximate location, so the 50m venue fence cannot reliably match. Turn on Precise Location for Safari, then test again.';
      return;
    }
    if(nearest && nearest.distance<=25){
      if(out) out.textContent='Very close to a participating venue, but outside the 50m fence. The venue pin likely needs moving to the correct entrance/position.';
      return;
    }
    if(nearest && nearest.distance<=50){
      if(out) out.textContent='Within about 50m of a participating venue. The phone location is working, but the venue pin needs checking for a 50m fence.';
      return;
    }
    if(nearest && nearest.distance<=100){
      if(out) out.textContent='Within about 100m of a participating venue. The location is too far away for the 50m production fence; we need to check the venue pin or phone location setting.';
      return;
    }
    if(out) out.textContent='Location was received, but no participating venue is nearby enough to diagnose a 50m match.';
  },err=>{
    let msg='Location could not be read.';
    if(err && err.code===1) msg='Safari did not provide location permission to this page.';
    else if(err && err.code===2) msg='The phone could not determine its location right now.';
    else if(err && err.code===3) msg='The location request timed out. Try again.';
    if(out) out.textContent=msg;
  },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}

function startVenueGeofencing(){
  if(hbGpsRunning)return;
  hbLoadVenueCoordinates();
  if(!navigator.geolocation){hbSetGpsStatus('GPS is not supported on this device/browser.');return;}
  hbGpsRunning=true;
  try{localStorage.setItem('hb_location_enabled_v1','true');}catch(e){}
  hbSetGpsStatus('Requesting location permission');
  hbGpsWatchId=navigator.geolocation.watchPosition(hbHandlePosition,hbHandleGpsError,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  hbStartPresenceHeartbeat();
  hbStartLiveRefresh();
  // Immediately request a fresh fix so venue entry does not wait for a later watch event.
  navigator.geolocation.getCurrentPosition(hbHandlePosition,hbHandleGpsError,{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  // Static coordinates are used immediately. Any remaining venue addresses are
  // geocoded in the background so the phone does not have to rely on missing pins.
  setTimeout(()=>{ try{ hbGeocodeAllVenues(); }catch(e){} },1200);
}

function stopVenueGeofencing(){
  if(hbGpsWatchId!==null && navigator.geolocation){navigator.geolocation.clearWatch(hbGpsWatchId);}
  hbGpsWatchId=null; hbGpsRunning=false;
  hbStopLiveRefresh();
  if(hbPresenceTimer){clearInterval(hbPresenceTimer);hbPresenceTimer=null;}
  const leavingVenue=hbCurrentVenueId;
  hbCurrentVenueId=null;
  if(leavingVenue)hbStopPresence(leavingVenue);
}

async function loadPremiumDemographics(venueId){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY)return null;
  try{
    const u=SUPABASE_URL+"/rest/v1/rpc/get_hb_premium_demographics";
    const r=await fetchWithTimeout(u,{method:"POST",headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_venue_id:String(venueId)})},8000);
    if(!r.ok){console.error("Premium demographics error",r.status,await r.text());return null;}
    const rows=await r.json();
    return Array.isArray(rows)&&rows.length?rows[0]:null;
  }catch(e){console.error("Premium demographics failed",e);return null;}
}

function renderVenueHistory(rows){
  if(!rows || !rows.length) return `<div class="card"><b>📈 Historical intelligence</b><p class="muted">Collecting the first venue history. Once activity builds, this will show the busiest days and times.</p></div>`;
  const max=Math.max(1,...rows.map(r=>Number(r.avg_active)||0));
  const totalSamples=rows.reduce((a,r)=>a+Number(r.samples||0),0);
  const peak=rows.reduce((a,b)=>(Number(b.avg_active)||0)>(Number(a.avg_active)||0)?b:a,rows[0]);
  return `<div class="card"><div class="row"><b>📈 Last 7 days</b><span class="pill">PREMIUM</span></div>
    <p class="muted small">Average anonymous active presence by day. History starts building automatically from live venue activity.</p>
    <div class="data-trend-grid">${rows.map(r=>{const n=Number(r.avg_active)||0;const h=Math.max(3,Math.round(n/max*100));return `<div class="data-trend-day"><div class="data-trend-bar-wrap"><div class="data-trend-bar" style="height:${h}%"></div></div><b>${escapeHtmlSafe(String(r.day_label||''))}</b><small>${n}</small></div>`}).join('')}</div>
    <div class="data-insight-grid"><div class="data-insight"><span class="muted small">Peak day</span><b>${escapeHtmlSafe(String(peak.day_label||'—'))}</b></div><div class="data-insight"><span class="muted small">Data samples</span><b>${totalSamples}</b></div></div>
  </div>`;
}

    const u=SUPABASE_URL+"/rest/v1/rpc/get_hb_crowd_trend";
    const r=await fetchWithTimeout(u,{method:"POST",headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_venue_id:String(venueId),p_days:Number(days)||7})},8000);
    if(!r.ok)return [];
    const rows=await r.json(); return Array.isArray(rows)?rows:[];
  }catch(e){return []}
}
function renderCrowdTrend(rows){
  if(!rows||!rows.length)return '';
  const r=rows[0];
  return `<div class="card"><div class="row"><b>⚖️ Crowd balance trend</b><span class="pill">PREMIUM</span></div><div class="data-insight-grid"><div class="data-insight"><span class="muted small">More Men</span><b>${Number(r.men_pct||0)}%</b></div><div class="data-insight"><span class="muted small">More Women</span><b>${Number(r.women_pct||0)}%</b></div></div><p class="small muted" style="margin-top:12px">Based on anonymous crowd answers from the selected period.</p></div>`;
}

async function premiumVenueDetail(name){
  if(!isPremium()){ premiumPaywall("Venue intelligence"); return; }
  const v=venues.find(x=>x.name===name) || venues[0];
  frame(`<div class="screen"><button class="secondary" onclick="premiumSinglesScreen()">← Venue Intelligence</button>
    <div class="venue-hero">
      <div class="venue-hero-top"><div style="display:flex;gap:13px;align-items:center"><div class="venue-icon">${hbVenueEmoji(v)}</div><div><div class="premium-badge">⭐ PREMIUM VENUE PROFILE</div><h1 class="venue-title" style="margin-top:10px">${escapeHtmlSafe(v.name)}</h1></div></div><span class="live-pill">● LIVE</span></div>
      <p class="muted" style="margin:16px 0 0">📍 ${escapeHtmlSafe(v.address)}</p>
    </div>
    <div class="card venue-big-count"><div class="muted small">LIVE NOW</div><b>${Number(v.busy||0)}</b><span>anonymous active presence</span></div>
    <div id="premiumDemographics"><div class="card"><div class="muted">Loading live demographics…</div></div></div>
    <div id="premiumHistory"><div class="card"><div class="muted">Loading historical intelligence…</div></div></div>
    <div id="premiumCrowdTrend"></div>
    <div class="premium-hero"><div class="premium-badge">📈 BUILDING OVER TIME</div><h2 style="margin:16px 0 8px">More data = better decisions</h2><p class="sub">As How Busy? collects enough anonymous activity, this venue can develop:</p>
      <div class="premium-feature"><span class="premium-feature-icon">🕐</span><div><b>Best times to visit</b><div class="muted small">See when this venue is typically busiest.</div></div></div>
      <div class="premium-feature"><span class="premium-feature-icon">📅</span><div><b>Historical patterns</b><div class="muted small">Compare days and times once enough history exists.</div></div></div>
      <div class="premium-feature"><span class="premium-feature-icon">🔥</span><div><b>Trending status</b><div class="muted small">See when activity is rising or falling.</div></div></div>
    </div>
  </div>${nav("home")}`);
  const d=await loadPremiumDemographics(v.id);
  const el=document.getElementById("premiumDemographics");
  if(el)el.innerHTML=renderPremiumDemographics(d);
  const history=await loadVenueHistory(v.id,7);
  const historyEl=document.getElementById("premiumHistory");
  if(historyEl)historyEl.innerHTML=renderVenueHistory(history);
  const crowdTrend=await loadVenueCrowdTrend(v.id,7);
  const trendEl=document.getElementById("premiumCrowdTrend");
  if(trendEl)trendEl.innerHTML=renderCrowdTrend(crowdTrend);
}
