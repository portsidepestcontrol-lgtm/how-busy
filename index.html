<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071522"><title>How Busy?</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071522;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0}.wrap{padding-bottom:85px}.top{padding:20px;display:flex;justify-content:space-between}.logo{font-size:28px;font-weight:900}.gold{color:#ffd21a}.sub,.meta{color:#91a3b3;font-size:13px}.search{margin:0 18px 12px;width:calc(100% - 36px);padding:14px;border:0;border-radius:14px;background:#112536;color:#fff}.chips{display:flex;gap:8px;overflow:auto;padding:0 18px 12px}.chip{padding:9px 15px;border-radius:20px;background:#112536;color:#ccd5dc;white-space:nowrap}.on{background:#ffd21a;color:#111;font-weight:800}.hero{display:flex;justify-content:space-between;align-items:center;padding:8px 18px}.hero h2{margin:0;font-size:20px}.card{margin:0 18px 9px;width:calc(100% - 36px);padding:13px;background:#0e2030;border-radius:16px;color:#fff;display:flex;gap:12px;text-align:left;align-items:center}.ico{width:48px;height:48px;border-radius:12px;background:#172d3f;display:grid;place-items:center;font-size:23px}.info{flex:1}.name{font-weight:800}.meta{font-size:11px;margin-top:4px}.badge{padding:5px 8px;border-radius:9px;font-size:11px;font-weight:800}.pct{text-align:right;font-size:12px;margin-top:4px}.loc{margin:0 18px 12px;padding:12px;background:#10283a;border-radius:14px;display:flex;justify-content:space-between;align-items:center}.yellow{background:#ffd21a;color:#111;padding:9px 12px;border-radius:10px;font-weight:800}.cta{margin:15px 18px;padding:18px;background:#162b3b;border-radius:16px}.action{width:100%;padding:15px;margin-top:12px;border-radius:13px;background:#ffd21a;font-weight:900}.screen{padding:22px 18px}.back{background:none;color:#fff}.title{font-size:29px;font-weight:900;margin:12px 0}.status{margin-top:18px;padding:18px;border:2px solid #7d8b96;border-radius:18px;background:#0e2030}.big{font-size:28px;font-weight:900;margin:7px 0}.row{padding:16px 0;border-bottom:1px solid #1d3343;display:flex;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.report{padding:17px;border-radius:13px;background:#102334;color:#fff}.map{background:#102334;border-radius:18px;padding:14px;min-height:55vh}.pin{width:100%;padding:13px;margin:4px 0;background:#172d3f;color:#fff;border-radius:12px;text-align:left}.bottom{position:fixed;bottom:0;left:0;right:0;height:76px;background:#091b2a;border-top:1px solid #1d3343;display:flex;justify-content:space-around;align-items:center}.nav{background:none;color:#718597}.toast{position:fixed;bottom:90px;left:18px;right:18px;background:#183044;padding:14px;border-radius:12px;text-align:center}
</style></head><body><div id="app"></div>
<script>

const SUPABASE_URL = "https://muabpzculmygamxanqzq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11YWJwemN1bG15Z2FteGFucXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MDAwMzAsImV4cCI6MjEwNjA3NjAzMH0.nop62gIjMtIKj6lxz6-447PVwFzJIS7mb2GxnP0MHjE";

async function cloudReport(venueId, percent, label, queueLabel=null){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return {ok:false,status:0,error:"Supabase configuration missing"};
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/venue_reports",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify({
        venue_id:Number(venueId),
        crowd_percent:Number(percent),
        crowd_label:label,
        queue_label:queueLabel
      })
    });
    if(!r.ok){
      const text=await r.text();
      console.error("How Busy Supabase error",r.status,text);
      return {ok:false,status:r.status,error:text};
    }
    return {ok:true,status:r.status};
  }catch(e){
    console.error("How Busy network error",e);
    return {ok:false,status:0,error:String(e)};
  }
}
async function cloudReports(venueId){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return null;
  try{
    const since=new Date(Date.now()-7200000).toISOString();
    const u=SUPABASE_URL+"/rest/v1/venue_reports?venue_id=eq."+venueId+"&created_at=gte."+encodeURIComponent(since)+"&select=crowd_percent,crowd_label,created_at&order=created_at.desc";
    const r=await fetch(u,{headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY}});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}
const data=[
["King Street","Club","Newcastle West","15 Steel St"],["Great Northern Hotel Newcastle","Pub","Newcastle","83-89 Scott St"],["The Lucky Hotel","Pub","Newcastle","237 Hunter St"],["Queens Wharf Hotel","Pub","Newcastle","150 Wharf Rd"],["Customs House Hotel","Pub","Newcastle","1 Bond St"],["George Darby Hotel","Pub","Cooks Hill","21 Darby St"],["The Exchange Hotel","Pub","Hamilton","125 Denison St"],["Crown & Anchor Hotel","Pub","Newcastle","189 Hunter St"],["Wests City","Club","Newcastle West","King St & Union St"],["The Underground","Live Music","Newcastle","32 Church St"],["The Rogue Scholar","Live Music","Newcastle West","4-6 Union St"],["Bernie's Bar","Bar","Newcastle West","410 King St"],["Maru HiFi","Live Music","Newcastle West","10 Union St"],["Jams Karaoke & Bar","Bar","Newcastle West","8 Union St"],["Coal & Cedar","Bar","Newcastle","380-382 Hunter St"],["Uptowns Bar","Bar","Newcastle","23 Watt St"],["The Koutetsu","Bar","Newcastle West","555 Hunter St"],["MoneyPenny","Bar","Honeysuckle","1 Honeysuckle Dr"],["Flamingos Live","Live Music","Lambton","31 Morehead St"],["Stag & Hunter Hotel","Pub","Mayfield","187 Maitland Rd"],["Wickham Park Hotel","Pub","Wickham","61 Union St"],["Kent Hotel","Pub","Hamilton","59 Beaumont St"],["Greenroof Hotel","Pub","Hamilton","71 Tudor St"],["Delany Hotel","Pub","Cooks Hill","134 Darby St"],["Commonwealth Hotel","Pub","Cooks Hill","35 Union St"],["Prince of Merewether","Pub","Merewether","1 Morgan St"],["Modus Merewether","Brewery","Merewether","2 Glebe Rd"],["Foghorn Brewery","Brewery","Newcastle","218 King St"],["Earp Distilling Co","Bar","Carrington","41 Darling St"],["Shout Brewing","Brewery","Islington","6 Steel St"],["Charlie's Rooftop","Bar","Newcastle West","537 Hunter St"],["Granddad's Bar Experience","Bar","Newcastle","515 Hunter St"],["Merewether Surfhouse","Bar","Merewether","5 Henderson Pde"],["Belmont 16s","Club","Belmont","The Parade"],["Warners Bay Hotel","Pub","Warners Bay","5 King St"],["Jewells Tavern","Pub","Jewells","Wommara Ave"],["Pippi's at the Point Hotel","Pub","Speers Point","The Esplanade"],["Lake Macquarie Tavern","Pub","Mount Hutton","1 Murray St"],["Toronto Hotel","Pub","Toronto","74 Victory Row"],["Swansea Workers Club","Club","Swansea","228 Pacific Hwy"],["Swansea RSL","Club","Swansea","2 Bridge St"],["Hotel Wangi","Pub","Wangi Wangi","295 Watkins Rd"],["Lake Macquarie Yacht Club","Club","Belmont","Ada St"]
];
const key="hb_reports_v4",savedKey="hb_saved_v4";let reports=JSON.parse(localStorage.getItem(key)||"{}"),saved=JSON.parse(localStorage.getItem(savedKey)||"[]"),filter="All",area="All",q="";
const V=data.map((x,i)=>({id:i,n:x[0],t:x[1],s:x[2],a:x[3]}));const C={Quiet:"#21c77a",Moderate:"#f4c542",Busy:"#ff9d2e",Packed:"#ff4d4d"};
function live(v){let r=(reports[v.id]||[]).filter(x=>Date.now()-x.t<7200000);if(!r.length)return null;let p=Math.round(r.reduce((a,b)=>a+b.p,0)/r.length),l=p<25?"Quiet":p<50?"Moderate":p<75?"Busy":"Packed";return{p,l,n:r.length}}
function home(){let x=V.filter(v=>(filter=="All"||v.t==filter)&&(area=="All"||v.s==area)&&(`${v.n} ${v.s} ${v.a}`).toLowerCase().includes(q.toLowerCase()));app.innerHTML=`<div class=wrap><div class=top><div><div class=logo>🍺 How <span class=gold>Busy?</span></div><div class=sub>Know before you go.</div></div><button onclick=settings()>⚙️</button></div><input id="venueSearch" class="search" type="search" autocomplete="off" placeholder="Search venues or suburbs..." value="${q}"><div class=chips>${["All","Pub","Club","Bar","Live Music","Brewery"].map(x=>`<button class="chip ${filter==x?"on":""}" onclick="filter='${x}';home()">${x}</button>`).join("")}</div><div class=hero><div><h2>${area=="All"?"Newcastle + Lake Macquarie":area}</h2><div class=sub>${x.length} venues</div></div><button class=yellow onclick=map()>🗺 Map</button></div><div class=chips>${["All","Newcastle","Lake Macquarie"].map(x=>`<button class="chip ${area==x?"on":""}" onclick="area='${x}';home()">${x}</button>`).join("")}</div><div class=loc>📍 Find venues near you <button class=yellow onclick=locate()>Use location</button></div><div id=venueResults>${x.map(card).join("")}</div><div class=cta><b class=gold>Where should I go?</b><div class=sub>Find somewhere quiet, busy or packed.</div><button class=action onclick=where()>Find a venue</button></div>${nav()}</div>`;bindSearch()}
function bindSearch(){const el=document.getElementById("venueSearch");if(!el)return;el.addEventListener("input",e=>{q=e.target.value;renderVenueResults()})}
function renderVenueResults(){const old=document.getElementById("venueSearch");if(!old)return;const cards=[...document.querySelectorAll(".card")];const x=V.filter(v=>(filter=="All"||v.t==filter)&&(area=="All"||v.s==area)&&(`${v.n} ${v.s} ${v.a}`).toLowerCase().includes(q.toLowerCase()));const parent=old.parentElement;let marker=document.getElementById("venueResults");if(!marker){marker=document.createElement("div");marker.id="venueResults";old.after(marker)}marker.innerHTML=x.map(card).join("");}
function card(v){let d=live(v);return `<button class=card onclick="venue(${v.id})"><div class=ico>${v.t=="Pub"?"🍻":v.t=="Club"?"🕺":v.t=="Bar"?"🍸":v.t=="Brewery"?"🍺":"🎵"}</div><div class=info><div class=name>${v.n}</div><div class=meta>${v.t} · ${v.s}</div><div class=meta>${v.a} · ${d?d.n+" live report"+(d.n>1?"s":""):"No live crowd data"}</div></div><div><div class=badge style="background:${d?C[d.l]:"#667784"}">${d?d.l:"No data"}</div><div class=pct>${d?d.p+"%":"—"}</div></div></button>`}
async function venue(id){
  let v=V[id];
  let d=live(v);
  try{
    const rows=await cloudReports(id);
    if(rows && rows.length){
  const now=Date.now();
  let total=0,weight=0;

  rows.forEach(r=>{
    const age=Math.max(0,now-new Date(r.created_at).getTime());
    const w=Math.max(0.1,1-age/(2*60*60*1000));
    total+=Number(r.crowd_percent)*w;
    weight+=w;
  });

  const avg=Math.round(total/weight);
  let l=avg>=76?"Packed":avg>=51?"Busy":avg>=26?"Moderate":"Quiet";
  d={avg:avg,l:l,n:rows.length};
}
    }
  }catch(e){console.error(e)}
  app.innerHTML=`<div class=screen><button class=back onclick=home()>‹ Back</button><div class=title>${v.n}</div><div class=sub>${v.t} · ${v.s}</div><div class=status><div class=sub>${d?"LIVE COMMUNITY REPORTS":"NO LIVE REPORTS YET"}</div><div class=big style="color:${d?C[d.l]:"#9aa8b2"}">${d?d.p+"% · "+d.l:"No live crowd data"}</div><div class=sub>${d?d.n+" reports in the last 2 hours":"Be the first to report this venue."}</div></div><div class=row><span>Address</span><b>${v.a}</b></div><button class=action onclick=report(${id})>📊 Report crowd</button><button class=action onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('${v.a}, ${v.s}, NSW'))">🧭 Directions</button><button class=action onclick="save(${id})">♡ Save venue</button></div>`;
}
function report(id){app.innerHTML=`<div class=screen><button class=back onclick="venue(${id})">‹ Back</button><div class=title>Report crowd</div><div class=sub>Your report helps everyone know before they go.</div><h3>How busy?</h3><div class=grid>${["Quiet","Moderate","Busy","Packed"].map(x=>`<button class=report onclick="send(${id},'${x}')">${x}</button>`).join("")}</div><h3>Queue</h3><div class=grid>${["None","Short","Long"].map(x=>`<button class=report onclick="send(${id},'${x}')">${x}</button>`).join("")}</div></div>`}
async function send(id,x){
  let p={Quiet:15,Moderate:40,Busy:65,Packed:90,None:0,Short:50,Long:85}[x];
  let label=["None","Short","Long"].includes(x)?"Moderate":x;
  reports[id]=reports[id]||[];
  reports[id].push({p,t:Date.now()});
  localStorage.setItem(key,JSON.stringify(reports));

  let result=await cloudReport(id,p,label,["None","Short","Long"].includes(x)?x:null);
  if(result.ok){
    toast("Report sent live");
  }else{
    console.error("Report was not sent:",result);
    toast(result.status?("Supabase error "+result.status):"Saved on this device");
  }
  setTimeout(()=>venue(id),700);
}
function locate(){navigator.geolocation?.getCurrentPosition(()=>toast("Location permission granted"),()=>toast("Location permission not allowed"))}
function map(){app.innerHTML=`<div class=screen><button class=back onclick=home()>‹ Back</button><div class=title>Venue map</div><div class=map><div style="text-align:center;font-size:50px">🗺️</div><p class=sub>${V.length} venues loaded. Live map integration is next.</p>${V.slice(0,15).map(v=>`<button class=pin onclick="venue(${v.id})">📍 ${v.n}<br><span class=sub>${v.s}</span></button>`).join("")}</div></div>`}
function where(){app.innerHTML=`<div class=screen><button class=back onclick=home()>‹ Back</button><div class=title>Where should I go?</div><div class=sub>Choose your night.</div><h3>Venue type</h3><div class=grid>${["Pub","Club","Bar","Live Music","Brewery"].map(x=>`<button class=report onclick="filter='${x}';home()">${x}</button>`).join("")}</div></div>`}
function save(id){if(saved.includes(id))saved=saved.filter(x=>x!=id);else saved.push(id);localStorage.setItem(savedKey,JSON.stringify(saved));toast("Saved");}
function savedPage(){let x=V.filter(v=>saved.includes(v.id));app.innerHTML=`<div class=screen><div class=title>Saved venues</div>${x.length?x.map(card).join(""):"<p class=sub>No saved venues yet.</p>"}</div>`}
function premium(){app.innerHTML=`<div class=screen><div class=title gold>How Busy? Premium</div><div class=sub>$3.99 AUD / month</div><div class=cta>${["Live crowd information","Crowd history & trends","Favourite alerts","Advanced filters","Unlimited saved venues","Ad-free experience"].map(x=>`<div class=row>✓ ${x}</div>`).join("")}<button class=action onclick="toast('Apple subscription will be connected for App Store launch')">Subscribe — $3.99/month</button></div></div>`}
function settings(){app.innerHTML=`<div class=screen><button class=back onclick=home()>‹ Back</button><div class=title>Settings</div><div class=row><span>Venues</span><b>${V.length}</b></div><div class=row><span>Your reports on this device</span><b>${Object.values(reports).flat().length}</b></div><div class=cta><b class=gold>Premium</b><p class=sub>$3.99 AUD/month</p></div></div>`}
function nav(){return `<div class=bottom><button class=nav onclick=home()>⌂<br>Home</button><button class=nav onclick=map()>◉<br>Map</button><button class=nav onclick=savedPage()>♡<br>Saved</button><button class=nav onclick=premium()>♛<br>Premium</button></div>`}
function toast(x){let d=document.createElement("div");d.className=toast;d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
home();
</script></body></html>
