/* Privacy-first activity signal:
   - location sharing is explicitly opt-in
   - coordinates are rounded before upload
   - raw device coordinates are never sent to Supabase
   - presence expires automatically in the database
*/
function coarseLocation(lat,lon){
  return {
    lat: Math.round(Number(lat)*1000)/1000,
    lon: Math.round(Number(lon)*1000)/1000
  };
}
async function sendActivityPresence(position,venueId=null){
  if(!activityEnabled || !position || !position.coords)return false;
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY)return false;
  const c=coarseLocation(position.coords.latitude,position.coords.longitude);
  try{
    const r=await fetchWithTimeout(SUPABASE_URL+"/rest/v1/activity_presence",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify({
        session_id:activitySession,
        lat:c.lat,
        lon:c.lon,
        expires_at:new Date(Date.now()+15*60*1000).toISOString(),
        venue_id: venueId==null ? null : Number(venueId)
      })
    },8000);
    if(!r.ok){console.error("Activity presence error",r.status,await r.text());return false}
    return true;
  }catch(e){
    console.error("Activity presence connection error",e);
    return false;
  }
}

}
function activityTick(){

function startActivity(){

    ()=>toast("Location permission not granted"),

}
function stopActivity(){

function safeJSON(value,fallback){try{return value?JSON.parse(value):fallback}catch(e){return fallback}}
function esc(value){return String(value).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function crowdLabel(p){return p>=76?"Packed":p>=51?"Busy":p>=26?"Moderate":"Quiet"}
function crowdPercent(label){return {Quiet:15,Moderate:40,Busy:65,Packed:90}[label] ?? 0}

/* Old versions of the app accidentally saved queue choices as crowd reports.
   These three values (10/50/85) with a Moderate crowd label identify those old
   queue-only rows. They are ignored when calculating live crowd levels. */
function isBadLegacyQueueRow(r){
  const p=Number(r.crowd_percent);
  return String(r.crowd_label)==="Moderate" && (p===10 || p===50 || p===85) && QUEUE_LABELS.has(String(r.queue_label));
}
function fetchWithTimeout(url,options={},ms=8000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  return fetch(url,{...options,signal:controller.signal}).finally(()=>clearTimeout(timer));
}

function validCloudCrowdRows(rows){
  return (Array.isArray(rows)?rows:[]).filter(r=>
    CROWD_LABELS.has(String(r.crowd_label)) &&
    Number.isFinite(Number(r.crowd_percent)) &&
    !isBadLegacyQueueRow(r)
  );
}

async function cloudReport(venueId,percent,label,queueLabel="None"){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){return {ok:false,status:0,error:"Supabase configuration missing"}}
  try{
    const r=await fetchWithTimeout(SUPABASE_URL+"/rest/v1/venue_reports",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify({
        venue_id:Number(venueId),
        crowd_percent:Number(percent),
        crowd_label:String(label),
        queue_label:String(queueLabel||"None"),
        crowd_mix: pendingReport && pendingReport.mix ? String(pendingReport.mix) : null,
        relationship_status: pendingReport && pendingReport.status ? String(pendingReport.status) : null
      })
    });
    if(!r.ok){
      const text=await r.text();
      console.error("Supabase POST error",r.status,text);
      return {ok:false,status:r.status,error:text};
    }
    return {ok:true,status:r.status};
  }catch(e){
    console.error("Supabase network error",e);
    return {ok:false,status:0,error:String(e)};
  }
}

async function cloudReports(venueId){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY)return [];

    const u=SUPABASE_URL+"/rest/v1/venue_reports?venue_id=eq."+encodeURIComponent(venueId)+

    const r=await fetchWithTimeout(u,{headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY}});
    if(!r.ok){const text=await r.text();console.error("Supabase GET error",r.status,text);return []}
    return validCloudCrowdRows(await r.json());
  }catch(e){console.error("cloudReports failed",e);return []}
}

/* Load all recent reports once, rather than making one Supabase request per venue. */
async function refreshCloudReports(force=false){
  const now=Date.now();
  if(!force && cloudLoadedAt && now-cloudLoadedAt<15000)return cloudRows;
  if(cloudPromise)return cloudPromise;
  cloudPromise=(async()=>{
    try{
      const since=new Date(Date.now()-7200000).toISOString();
      const u=SUPABASE_URL+"/rest/v1/venue_reports?created_at=gte."+encodeURIComponent(since)+
        "&select=venue_id,crowd_percent,crowd_label,queue_label,created_at&order=created_at.desc&limit=1000";
      const r=await fetchWithTimeout(u,{headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY}});
      if(!r.ok){
        const text=await r.text();
        console.error("Supabase live reports error",r.status,text);
        return cloudRows;
      }
      cloudRows=validCloudCrowdRows(await r.json());
      cloudLoadedAt=Date.now();
      return cloudRows;
    }catch(e){
      console.error("Supabase live reports connection error",e);
      return cloudRows;
    }finally{cloudPromise=null}
  })();
  return cloudPromise;
}

function localLive(v){
  const r=(reports[v.id]||[]).filter(x=>Date.now()-Number(x.t)<7200000 && Number.isFinite(Number(x.p)));
  if(!r.length)return null;
  const p=Math.round(r.reduce((a,b)=>a+Number(b.p),0)/r.length);
  return {p,l:crowdLabel(p),n:r.length,source:"local"};
}
function cloudLive(v){
  const r=cloudRows.filter(x=>Number(x.venue_id)===Number(v.id));
  if(!r.length)return null;
  const p=Math.round(r.reduce((a,b)=>a+Number(b.crowd_percent),0)/r.length);
  return {p,l:crowdLabel(p),n:r.length,source:"cloud"};
}
function live(v){return cloudLive(v)||localLive(v)}

const lakeSuburbs=new Set(["Belmont","Warners Bay","Jewells","Speers Point","Mount Hutton","Toronto","Swansea","Wangi Wangi"]);
function areaMatches(v){
  if(area==="All")return true;
  if(area==="Lake Macquarie")return lakeSuburbs.has(v.s);
  if(area==="Newcastle")return !lakeSuburbs.has(v.s);
  return true;
}
function filteredVenues(){
  const term=q.trim().toLowerCase();
  return V.filter(v=>(filter==="All"||v.t===filter)&&areaMatches(v)&&(`${v.n} ${v.t} ${v.s} ${v.a}`).toLowerCase().includes(term));
}

     background and the venue list is updated when it arrives. */
  const x=filteredVenues();
  app.innerHTML=`<div class="wrap"><div class="top"><div><div class="logo">🍺 How <span class="gold">Busy?</span></div><div class="sub">Know before you go.</div></div><button onclick="settings()">⚙️</button></div><input id="venueSearch" class="search" type="search" autocomplete="off" placeholder="Search venues or suburbs..." value="${esc(q)}"><div class="chips">${["All","Pub","Club","Bar","Live Music","Brewery"].map(x=>`<button class="chip ${filter===x?"on":""}" onclick="filter='${x}';home()">${x}</button>`).join("")}</div><div class="hero"><div><h2>${area==="All"?"Newcastle + Lake Macquarie":esc(area)}</h2><div class="sub">${x.length} venues</div></div><button class="yellow" onclick="map()">🗺 Map</button></div><div class="chips">${["All","Newcastle","Lake Macquarie"].map(x=>`<button class="chip ${area===x?"on":""}" onclick="area='${x}';home()">${x}</button>`).join("")}</div><div class="loc">📍 Find venues near you <button class="yellow" onclick="locate()">Use location</button></div><div id="venueResults">${x.map(card).join("")}</div><div class="cta"><b class="gold">Where should I go?</b><div class="sub">Find somewhere quiet, busy or packed.</div><button class="action" onclick="where()">Find a venue</button></div>${nav()}</div>`;
  bindSearch();
  refreshCloudReports(true).then(()=>renderVenueResults()).catch(e=>console.error(e));
}
function bindSearch(){const el=document.getElementById("venueSearch");if(!el)return;el.addEventListener("input",e=>{q=e.target.value;renderVenueResults()})}
function renderVenueResults(){const marker=document.getElementById("venueResults");if(marker)marker.innerHTML=filteredVenues().map(card).join("")}
function card(v){
  const d=live(v);
  const icon=v.t==="Pub"?"🍻":v.t==="Club"?"🕺":v.t==="Bar"?"🍸":v.t==="Brewery"?"🍺":"🎵";
  return `<button class="card" onclick="venue(${v.id})"><div class="ico">${icon}</div><div class="info"><div class="name">${esc(v.n)}</div><div class="meta">${esc(v.t)} · ${esc(v.s)}</div><div class="meta">${esc(v.a)} · ${d?d.n+" live report"+(d.n>1?"s":""):"No live crowd data"}</div></div><div><div class="badge" style="background:${d?C[d.l]:"#667784"}">${d?d.l:"No data"}</div><div class="pct">${d?d.p+"%":"—"}</div></div></button>`;
}

async function venue(id){
  activeVenueId=id;
  updateActivityVenue(id);
  setTimeout(()=>refreshVenueSignals(id),100);

  const v=V[id];
  if(!v){home();return}
  await refreshCloudReports(true);
  const d=live(v);
  const dataText=d?`${d.p}% · ${d.l}`:"No live crowd data";
  app.innerHTML=`<div class="screen"><button class="back" onclick="home()">‹ Back</button><div class="title">${esc(v.n)}</div><div class="sub">${esc(v.t)} · ${esc(v.s)}</div><div id="venueSignals"></div><div class="status"><div class="sub">${d?"LIVE COMMUNITY REPORTS":"NO LIVE REPORTS YET"}</div><div class="big" style="color:${d?C[d.l]:"#9aa8b2"}">${dataText}</div><div class="sub">${d?d.n+" reports in the last 2 hours":"Be the first to report this venue."}</div></div><div class="row"><span>Address</span><b>${esc(v.a)}</b></div><button class="action" onclick="report(${id})">📊 Report crowd</button><button class="action" type="button" onclick="showWhosOut(${id})">👀 Who's Out</button><button class="action" onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('${esc(v.a)}, ${esc(v.s)}, NSW'),'_blank')">🧭 Directions</button><button class="action" onclick="save(${id})">${saved.includes(id)?"♥ Saved":"♡ Save venue"}</button></div>`;
}

function showWhosOut(id){
  const v=V[id];
  if(!v){ return; }
  app.innerHTML=`<div class="screen">
    <button class="back" type="button" onclick="venue(${id})">‹ Back</button>
    <div class="title">👀 Who's Out?</div>
    <div class="sub">${esc(v.n)} · ${esc(v.s)}</div>
    <div id="whosOutAggregate" class="whosOut">
      <div class="whosOutTitle">👀 WHO'S OUT</div>
      <div class="sub" style="margin-top:7px">Loading recent optional reports…</div>
    </div>
    <button class="action" type="button" onclick="report(${id})">📊 Add your crowd report</button>
  </div>`;
  refreshWhosOut(id);
}

let pendingReport={crowd:null,queue:null,mix:null,status:null};
function report(id){
  pendingReport={crowd:null,queue:null,mix:null,status:null};
  app.innerHTML=`<div class="screen"><button class="back" onclick="venue(${id})">‹ Back</button><div class="title">Report crowd</div><div class="sub">Your report helps everyone know before they go.</div><h3>1. How busy?</h3><div class="grid" id="crowdChoices">${["Quiet","Moderate","Busy","Packed"].map(x=>`<button class="report" onclick="chooseCrowd('${x}')">${x}</button>`).join("")}</div><h3>2. Queue</h3><div class="grid" id="queueChoices">${["None","Short","Long"].map(x=>`<button class="report" onclick="chooseQueue('${x}')">${x}</button>`).join("")}</div><h3>3. WHO'S OUT 👀 <span class="optional">OPTIONAL</span></h3><div class="grid" id="mixChoices">${[["Male","Men"],["Female","Women"],["Prefer not to say","Prefer not to say"]].map(([value,label])=>`<button type="button" class="report mixChoice" data-mix="${value}">${label}</button>`).join("")}</div><h3>4. Relationship status <span class="optional">OPTIONAL</span></h3><div class="grid" id="statusChoices">${["Single","Taken","Prefer not to say"].map(x=>`<button class="report" onclick="chooseStatus('${x}')">${x}</button>`).join("")}</div><p class="privacyNote">WHO'S OUT and relationship status are optional. Individual answers are never displayed; only Men/Women responses are included in the aggregate, which appears after at least 5 responses.</p><button class="action" onclick="submitReport(${id})">Send report</button></div>`;
  bindMixChoices();
}
function chooseCrowd(x){pendingReport.crowd=x;document.querySelectorAll("#crowdChoices .report").forEach(b=>b.classList.toggle("selected",b.textContent===x))}
function chooseQueue(x){pendingReport.queue=x;document.querySelectorAll("#queueChoices .report").forEach(b=>b.classList.toggle("selected",b.textContent===x))}
function chooseMix(x){pendingReport.mix=x;document.querySelectorAll("#mixChoices .mixChoice").forEach(b=>b.classList.toggle("selected",b.dataset.mix===x))}
function bindMixChoices(){document.querySelectorAll("#mixChoices .mixChoice").forEach(b=>{b.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();chooseMix(this.dataset.mix)})})}
function chooseStatus(x){pendingReport.status=x;document.querySelectorAll("#statusChoices .report").forEach(b=>b.classList.toggle("selected",b.textContent===x))}

async function submitReport(id){
  if(!pendingReport.crowd){toast("Please choose how busy it is");return}
  const crowd=pendingReport.crowd;
  const queue=pendingReport.queue||"None";
  const p=crowdPercent(crowd);
  reports[id]=reports[id]||[];
  reports[id].push({p,t:Date.now(),queue,mix:pendingReport.mix,status:pendingReport.status});
  localStorage.setItem(key,JSON.stringify(reports));
  const result=await cloudReport(id,p,crowd,queue);
  if(result.ok){
    cloudLoadedAt=0;
    await refreshCloudReports(true);
    toast("Report sent live");
  }else{
    toast(result.status?`Saved here — Supabase error ${result.status}`:"Saved on this device");
  }
  setTimeout(()=>venue(id),700);
}

function locate(){
  if(!navigator.geolocation){toast("Location is not supported on this device");return}
  navigator.geolocation.getCurrentPosition(()=>toast("Location permission granted"),()=>toast("Location permission not allowed"));
}
function map(){app.innerHTML=`<div class="screen"><button class="back" onclick="home()">‹ Back</button><div class="title">Venue map</div><div class="map"><div style="text-align:center;font-size:50px">🗺️</div><p class="sub">${V.length} venues loaded. Select a venue below.</p>${V.slice(0,15).map(v=>`<button class="pin" onclick="venue(${v.id})">📍 ${esc(v.n)}<br><span class="sub">${esc(v.s)}</span></button>`).join("")}</div></div>`}
function where(){app.innerHTML=`<div class="screen"><button class="back" onclick="home()">‹ Back</button><div class="title">Where should I go?</div><div class="sub">Choose your night.</div><h3>Venue type</h3><div class="grid">${["Pub","Club","Bar","Live Music","Brewery"].map(x=>`<button class="report" onclick="filter='${x}';home()">${x}</button>`).join("")}</div></div>`}
function save(id){if(saved.includes(id))saved=saved.filter(x=>x!==id);else saved.push(id);localStorage.setItem(savedKey,JSON.stringify(saved));toast(saved.includes(id)?"Saved":"Removed from saved");setTimeout(()=>venue(id),500)}
function savedPage(){const x=V.filter(v=>saved.includes(v.id));app.innerHTML=`<div class="screen"><button class="back" onclick="home()">‹ Back</button><div class="title">Saved venues</div>${x.length?x.map(card).join(""):"<p class=sub>No saved venues yet.</p>"}</div>`}
function premium(){app.innerHTML=`<div class="screen"><button class="back" onclick="home()">‹ Back</button><div class="premiumHero"><div class="title gold">How Busy? Premium</div><div class="premiumPrice">$4.99 AUD / month</div><div class="sub">Less than a drink.</div><h2>🎉 LET'S GET THE PARTY STARTED!</h2></div><div class="cta">${activityControl()}${["📍 Live Activity Detection — optional location sharing","👥 Crowd Mix — optional Men / Women","💕 Relationship Status — optional Single / Taken","🔴 Smarter live crowd levels","📈 Crowd history & trends","🔔 Favourite venue alerts","🔥 Trending busy areas","♾️ Unlimited saved venues","🚫 Ad-free experience"].map(x=>`<div class="premiumFeature">✓ ${x}</div>`).join("")}<p class="privacyNote"><b>Optional means optional.</b> Location, Who’s Out and relationship status are never required to use How Busy?. Individual answers are not shown to other users; only aggregated information may be displayed.</p><button class="action" onclick="toast('Subscription checkout will be connected for App Store launch')">Subscribe — $4.99/month</button></div></div>`}
function settings(){app.innerHTML=`<div class="screen"><button class="back" onclick="home()">‹ Back</button><div class="title">Settings</div><div class="row"><span>Venues</span><b>${V.length}</b></div><div class="row"><span>Your reports on this device</span><b>${Object.values(reports).flat().length}</b></div><div class="cta"><b class="gold">Premium</b><p class="sub">$4.99 AUD/month</p></div></div>`}
function nav(){return `<div class="bottom"><button class="nav" onclick="home()">⌂<br>Home</button><button class="nav" onclick="map()">◉<br>Map</button><button class="nav" onclick="savedPage()">♡<br>Saved</button><button class="nav" onclick="premium()">♛<br>Premium</button></div>`}
function toast(x){const d=document.createElement("div");d.className="toast";d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

home();
</script>
</body>
</html>
