function hbDeviceId(){
  let id=localStorage.getItem("hb_device_id");
  if(!id){
    if(window.crypto && crypto.randomUUID) id=crypto.randomUUID();
    else id="hb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    localStorage.setItem("hb_device_id",id);
  }
  return id;
}

async function supabaseRequest(path, options={}){
  const headers=Object.assign({
    "apikey":SUPABASE_ANON_KEY,
    "Authorization":"Bearer "+SUPABASE_ANON_KEY,
    "Content-Type":"application/json"
  }, options.headers||{});
  const res=await fetch(SUPABASE_URL+path,Object.assign({},options,{headers}));
  const text=await res.text();
  let data=null;
  try{ data=text?JSON.parse(text):null; }catch(e){ data=text; }
  if(!res.ok) throw new Error((data&&data.message)||"Supabase error "+res.status);
  return data;
}

function backendStatus(message, ok=true){
  const old=document.getElementById("backend-status");
  if(old) old.remove();
  const el=document.createElement("div");
  el.id="backend-status";
  el.className="backend-status "+(ok?"ok":"bad");
  el.textContent=message;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

async function saveProfileToSupabase(){
  const relationship=localStorage.getItem("hbRelationship")||null;
  const gender=localStorage.getItem("hbGender")||null;
  if(!relationship && !gender){
    backendStatus("Choose Single/Taken or Male/Female first.",false);
    return;
  }
  try{
    await supabaseRequest("/rest/v1/rpc/save_hb_profile", {
      method:"POST",
      body:JSON.stringify({
        p_device_id:hbDeviceId(),
        p_relationship_status:relationship,
        p_gender:gender
      })
    });
    backendStatus("✓ Profile answer saved");
  }catch(e){
    console.error("Profile save failed",e);
    backendStatus("Server save failed: "+(e.message||"unknown error"),false);
  }
}

async function submitCrowdAnswerToSupabase(venueId, answer){
  try{
    await supabaseRequest("/rest/v1/rpc/submit_hb_crowd_report", {
      method:"POST",
      body:JSON.stringify({
        p_device_id:hbDeviceId(),
        p_venue_id:String(venueId),
        p_crowd_mix:answer
      })
    });
    backendStatus("✓ Crowd answer sent");
    return true;
  }catch(e){
    console.error("Crowd report failed",e);
    backendStatus("Crowd upload failed: "+(e.message||"unknown error"),false);
    return false;
  }
}

/* =========================================================
   HOW BUSY? — V27 — 50 METRE VENUE GEOFENCE ENGINE
   - Standard radius: 50m for every participating venue.
   - The nearest mapped venue wins when multiple 50m circles overlap.
   - Coordinates are resolved from each venue address and cached locally.
   - The phone performs the geofence calculation locally.
   - Presence uploads contain only anonymous device + venue + expiry data;
     raw GPS coordinates are NOT uploaded.
========================================================= */
const HB_GEOFENCE_RADIUS_METRES = 50;
const HB_CLOSE_VENUE_RADIUS_METRES = 0;
const HB_CLOSE_MIN_RADIUS_METRES = 50;
const HB_CLOSE_MAX_RADIUS_METRES = 50;
let hbGpsWatchId = null;
let hbGpsRunning = false;
let hbCurrentVenueId = null;
let hbLastGps = null;
let hbGeocodeRunning = false;
let hbPresenceTimer = null;

function hbDistanceMetres(lat1,lon1,lat2,lon2){
  const R=6371000;
  const p1=Number(lat1)*Math.PI/180, p2=Number(lat2)*Math.PI/180;
  const dLat=(Number(lat2)-Number(lat1))*Math.PI/180;
  const dLon=(Number(lon2)-Number(lon1))*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function hbClamp(n,min,max){ return Math.max(min,Math.min(max,n)); }

function hbVenueRadius(v){
  return HB_GEOFENCE_RADIUS_METRES;
}

async function hbGeocodeVenue(v){
  if(!v || !v.address || (Number.isFinite(Number(v.lat))&&Number.isFinite(Number(v.lon)))) return true;
  try{
    const q=encodeURIComponent(v.address+', Australia');
    const r=await fetch('https://photon.komoot.io/api/?q='+q+'&limit=1',{headers:{'Accept':'application/json'}});
    if(!r.ok)return false;
    const j=await r.json();
    const f=j && j.features && j.features[0];
    const c=f && f.geometry && f.geometry.coordinates;
    if(!c || c.length<2)return false;
    hbSaveVenueCoordinates(v,c[1],c[0]);
    return true;
  }catch(e){ return false; }
}

async function hbGeocodeAllVenues(){
  if(hbGeocodeRunning)return;
  hbGeocodeRunning=true;
  let done=0;
  const queue=venues.filter(v=>!Number.isFinite(Number(v.lat))||!Number.isFinite(Number(v.lon)));
  const workers=Math.min(4,Math.max(1,queue.length));
  async function worker(){
    while(queue.length){
      const v=queue.shift();
      if(!v) return;
      await hbGeocodeVenue(v);
      done++;
      hbRenderNearbyVenues();
      if(done%10===0) hbSetGpsStatus('Venue database: '+done+'/'+venues.length+' locations checked');
      await new Promise(r=>setTimeout(r,250));
    }
  }
  await Promise.all(Array.from({length:workers},worker));
  venues.forEach(v=>{if(Number.isFinite(Number(v.lat))&&Number.isFinite(Number(v.lon))){v.radius=50;v.verified=true;}});
  hbGeocodeRunning=false;
  const mapped=venues.filter(v=>Number.isFinite(Number(v.lat))&&Number.isFinite(Number(v.lon))).length;
  hbSetGpsStatus('Venue database: '+mapped+'/'+venues.length+' venues mapped · 50m geofence');
}
function hbFindVenue(lat,lon){
  let nearest=null, nearestDistance=Infinity;
  for(const v of venues){
    if(!Number.isFinite(Number(v.lat))||!Number.isFinite(Number(v.lon)))continue;
    const radius=hbVenueRadius(v);
    v.radius=radius;
    const d=hbDistanceMetres(lat,lon,v.lat,v.lon);
    if(d<=radius && d<nearestDistance){ nearest={venue:v,distance:d,radius}; nearestDistance=d; }
  }
  return nearest;
}

function hbDeviceId(){
  let id=localStorage.getItem('hbDeviceId');
  if(!id){ id='hb_'+crypto.randomUUID(); localStorage.setItem('hbDeviceId',id); }
  return id;
}

async function hbRecordPresence(venueId){
  if(!venueId) return {ok:false,stage:'venue',error:'Missing venue id'};
  const deviceId=hbDeviceId();
  const result={ok:false,deviceId,venueId:String(venueId),rpc:null,activity:null,error:null};

  // Single authoritative path for the new venue-presence table.
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/record_hb_presence',{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_device_id:deviceId,p_venue_id:String(venueId)})
    });
    const body=await r.text();
    if(r.ok){ result.rpc={ok:true,status:r.status}; result.ok=true; }
    else { result.rpc={ok:false,status:r.status,body}; result.error='Supabase RPC rejected the presence: HTTP '+r.status+(body?' · '+body:''); }
  }catch(e){
    result.rpc={ok:false,error:String(e&&e.message||e)};
    result.error='Could not reach Supabase RPC: '+(e&&e.message||e);
  }

  // Compatibility write is retained so existing activity analytics can also see the venue.
  if(hbLastGps && Number.isFinite(hbLastGps.lat) && Number.isFinite(hbLastGps.lon)){
    try{
      const lat=Math.round(hbLastGps.lat*1000)/1000;
      const lon=Math.round(hbLastGps.lon*1000)/1000;
      const r2=await fetch(SUPABASE_URL+'/rest/v1/activity_presence',{
        method:'POST',
        headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({session_id:deviceId,lat,lon,expires_at:new Date(Date.now()+15*60*1000).toISOString(),venue_id:String(venueId)})
      });
      const body2=await r2.text();
      result.activity={ok:r2.ok,status:r2.status,body:body2};
      if(r2.ok) result.ok=true;
    }catch(e){ result.activity={ok:false,error:String(e&&e.message||e)}; }
  }
  return result;
}

function hbFormatPresenceResult(result, venueName){
  if(result && result.ok) return '✓ '+venueName+' detected — presence sent to Supabase.';
  const rpc=result && result.rpc;
  if(rpc && rpc.status===404) return 'Venue detected, but Supabase does not have the record_hb_presence function. Run the geofence SQL once in Supabase.';
  if(rpc && rpc.body) return 'Venue detected, but Supabase rejected the presence: '+rpc.body;
  if(result && result.activity && result.activity.body) return 'Venue detected, but the Supabase activity upload failed: '+result.activity.body;
  return 'Venue detected, but the presence could not be sent to Supabase.';
}
async function hbStopPresence(venueId){
  if(!venueId)return;
  const deviceId=hbDeviceId();
  // End the authoritative venue-presence record immediately.
  try{
    await fetch(SUPABASE_URL+'/rest/v1/rpc/leave_hb_presence',{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_device_id:deviceId,p_venue_id:String(venueId)})
    });
  }catch(e){}
  // Also end the legacy activity row immediately when the optional RPC exists.
  try{
    await fetch(SUPABASE_URL+'/rest/v1/rpc/leave_hb_activity_presence',{
      method:'POST',

      body:JSON.stringify({p_device_id:deviceId,p_venue_id:String(venueId)})
    });
  }catch(e){}
}

function hbRenderNearbyVenues(){
  const box=document.getElementById('hbNearbyVenues');
  if(!box)return;
  if(!hbLastGps || !Number.isFinite(hbLastGps.lat) || !Number.isFinite(hbLastGps.lon)){
    box.innerHTML='<div class="muted" style="padding:18px 0">Finding your location and nearby pubs…</div>';
    return;
  }
  const nearby=[];
  for(const v of venues){
    if(!Number.isFinite(Number(v.lat))||!Number.isFinite(Number(v.lon)))continue;
    if(!/pub/i.test(String(v.type||'')))continue;
    const d=hbDistanceMetres(hbLastGps.lat,hbLastGps.lon,v.lat,v.lon);
    if(d<=10000) nearby.push({v,d});
  }
  nearby.sort((a,b)=>a.d-b.d);
  if(!nearby.length){
    box.innerHTML='<div class="muted" style="padding:18px 0">No mapped pubs found near your current location yet.</div>';
    return;
  }
  box.innerHTML=nearby.slice(0,5).map(({v,d})=>{
    // Only label a venue "AT VENUE" when this is a fresh GPS fix and the
    // calculated distance is genuinely inside the 50m production fence.
    const fresh=hbLastGps && (Date.now()-hbLastGps.at)<120000;
    const inside=fresh && d<=hbVenueRadius(v);
    const distance=d<1000?Math.round(d)+' m':(d/1000).toFixed(1)+' km';
    return `<div class="card venue" style="margin:10px 0" onclick="venue(${JSON.stringify(v.id)})">
      <div class="row"><div><b>${escapeHtmlSafe(v.name||'Venue')}</b><div class="muted small">${escapeHtmlSafe(v.type||'Pub')} · ${escapeHtmlSafe(v.address||'')}</div></div><div style="text-align:right"><b>${distance}</b><div class="muted small">${inside?'AT VENUE':'away'}</div></div></div>
    </div>`;
  }).join('');
}

async function hbLoadLiveVenueCounts(){

  // No raw GPS is returned to the browser.
  try{
    const result=await supabaseRequest('/rest/v1/rpc/hb_active_presence_counts',{method:'POST',body:'{}'});

function hbRenderHomeRankings(){
  const closeBox=document.getElementById('hbClosestPubs');
  const busyBox=document.getElementById('hbBusiestPubs');
  if(!closeBox||!busyBox)return;

  if(!hbLastGps || !Number.isFinite(hbLastGps.lat) || !Number.isFinite(hbLastGps.lon)){
    closeBox.innerHTML='<div class="muted">Waiting for your phone location…</div>';
  }else{
    const closest=venues.filter(v=>/pub/i.test(String(v.type||'')) && Number.isFinite(Number(v.lat)) && Number.isFinite(Number(v.lon)))
      .map(v=>({v,d:hbDistanceMetres(hbLastGps.lat,hbLastGps.lon,v.lat,v.lon)}))
      .sort((a,b)=>a.d-b.d).slice(0,5);
    closeBox.innerHTML=closest.length?closest.map(({v,d})=>{
      const inside=(Date.now()-hbLastGps.at)<120000 && d<=hbVenueRadius(v);
      const dist=d<1000?Math.round(d)+' m':(d/1000).toFixed(1)+' km';
      return `<div class="rank-row" onclick="venue(${JSON.stringify(v.id)})"><div><b>${escapeHtmlSafe(v.name)}</b><div class="muted small">${escapeHtmlSafe(v.address)}</div></div><div class="rank-right"><b>${dist}</b><span class="muted small">${inside?'AT VENUE':'away'}</span></div></div>`;
    }).join(''):'<div class="muted">We are still mapping Newcastle pubs for location ranking.</div>';
  }

  const pubs=venues.filter(v=>/pub/i.test(String(v.type||'')));
  pubs.sort((a,b)=>Number(b.busy||0)-Number(a.busy||0));
  const top=pubs.slice(0,8);
  busyBox.innerHTML=top.map((v,i)=>`<div class="rank-row" onclick="venue(${JSON.stringify(v.id)})"><div><b>${i+1}. ${escapeHtmlSafe(v.name)}</b><div class="muted small">${escapeHtmlSafe(v.address)}</div></div><div class="rank-right"><b>${Number(v.busy||0)}</b><span class="muted small">people now</span></div></div>`).join('');
}

function hbHandlePosition(position){
  const lat=Number(position.coords.latitude), lon=Number(position.coords.longitude);
  if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
  hbLastGps={lat,lon,accuracy:Number(position.coords.accuracy)||null,at:Date.now()};
  hbRenderNearbyVenues();
  hbRenderHomeRankings();
  const hit=hbFindVenue(lat,lon);
  const newId=hit?hit.venue.id:null;
  if(newId!==hbCurrentVenueId){
    const oldId=hbCurrentVenueId;
    hbCurrentVenueId=newId;
    try{localStorage.setItem('hbCurrentVenueId',newId||'');}catch(e){}
    // Crossing outside the current venue's geofence immediately ends presence.
    if(oldId)hbStopPresence(oldId);
    if(hit){
      hbRecordPresence(hit.venue.id);
      hbSetGpsStatus('📍 At '+hit.venue.name+' · '+Math.round(hit.distance)+'m · '+hit.radius+'m geofence');
    }else{
      hbSetGpsStatus('📍 No participating venue within 50m');
    }
  }
}

function hbHandleGpsError(err){
  const msg=err && err.code===1?'Location permission is off.':err && err.code===2?'Location position unavailable right now.':'Location timed out — trying again.';
  hbSetGpsStatus('⚠️ '+msg);
}

async function hbTestLocationNow(){
  try{ localStorage.removeItem('hbSunnysideCalibrated'); }catch(e){}
  const out=document.getElementById('hbLocationTestResult');
  if(out) out.textContent='Testing venue detection…';
  hbLoadVenueCoordinates();
  // Venue coordinates are fixed in the build; no user calibration is used.
  if(!navigator.geolocation){
    if(out) out.textContent='Location is not available in this browser.';
    return;
  }
  navigator.geolocation.getCurrentPosition(async position=>{
    const lat=Number(position.coords.latitude), lon=Number(position.coords.longitude);
    const accuracy=Number(position.coords.accuracy)||null;
    hbHandlePosition(position);
    const hit=hbFindVenue(lat,lon);
    if(hit){
      const saved=await hbRecordPresence(hit.venue.id);
      hbCurrentVenueId=hit.venue.id;
      if(out) out.textContent=hbFormatPresenceResult(saved,hit.venue.name);
      return;
    }

    // V18 diagnostic: never show coordinates or raw GPS accuracy.
    // We only report a distance band so we can distinguish a bad venue pin
    // from an iPhone/Safari location that is too approximate for a 50m fence.
    let nearest=null;
    for(const v of venues){
      if(!Number.isFinite(Number(v.lat))||!Number.isFinite(Number(v.lon)))continue;
      const d=hbDistanceMetres(lat,lon,v.lat,v.lon);
      if(!nearest || d<nearest.distance) nearest={venue:v,distance:d};
    }

    if(accuracy && accuracy>25){
      if(out) out.textContent='Your phone is returning an approximate location, so the 50m venue fence cannot reliably match. Turn on Precise Location for Safari, then test again.';
      return;
    }
    if(nearest && nearest.distance<=25){
      if(out) out.textContent='Very close to a participating venue, but outside the 50m fence. The venue pin likely needs moving to the correct entrance/position.';
      return;
    }
    if(nearest && nearest.distance<=50){
      if(out) out.textContent='Within about 50m of a participating venue. The phone location is working, but the venue pin needs checking for a 50m fence.';
      return;
    }
    if(nearest && nearest.distance<=100){
      if(out) out.textContent='Within about 100m of a participating venue. The location is too far away for the 50m production fence; we need to check the venue pin or phone location setting.';
      return;
    }
    if(out) out.textContent='Location was received, but no participating venue is nearby enough to diagnose a 50m match.';
  },err=>{
    let msg='Location could not be read.';
    if(err && err.code===1) msg='Safari did not provide location permission to this page.';
    else if(err && err.code===2) msg='The phone could not determine its location right now.';
    else if(err && err.code===3) msg='The location request timed out. Try again.';
    if(out) out.textContent=msg;
  },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}

function startVenueGeofencing(){
  if(hbGpsRunning)return;
  hbLoadVenueCoordinates();
  if(!navigator.geolocation){hbSetGpsStatus('GPS is not supported on this device/browser.');return;}
  hbGpsRunning=true;
  try{localStorage.setItem('hb_location_enabled_v1','true');}catch(e){}
  hbSetGpsStatus('Requesting location permission');
  hbGpsWatchId=navigator.geolocation.watchPosition(hbHandlePosition,hbHandleGpsError,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  hbStartPresenceHeartbeat();
  // Immediately request a fresh fix so venue entry does not wait for a later watch event.
  navigator.geolocation.getCurrentPosition(hbHandlePosition,hbHandleGpsError,{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  // Static coordinates are used immediately. Any remaining venue addresses are
  // geocoded in the background so the phone does not have to rely on missing pins.
  setTimeout(()=>{ try{ hbGeocodeAllVenues(); }catch(e){} },1200);
}

function stopVenueGeofencing(){
  if(hbGpsWatchId!==null && navigator.geolocation){navigator.geolocation.clearWatch(hbGpsWatchId);}
  hbGpsWatchId=null; hbGpsRunning=false;
  if(hbPresenceTimer){clearInterval(hbPresenceTimer);hbPresenceTimer=null;}
  const leavingVenue=hbCurrentVenueId;
  hbCurrentVenueId=null;
  if(leavingVenue)hbStopPresence(leavingVenue);
}

function premiumVenueData(v){
  // Visual prototype data. Production values will be calculated from
  // aggregated anonymous presence events in Supabase.
  const seed=(v.name||"Venue").length;
  const base=v.busy||Math.max(25,40+(seed%50));
  const single=Math.min(72,Math.max(42,50+(seed%20)));
  return {
    live:base,
    single,
    taken:100-single,
    men:48+(seed%13),
    women:52-(seed%13),
    hours:[
      {time:"6 PM",people:Math.round(base*.55),single:Math.max(40,single-6)},
      {time:"7 PM",people:Math.round(base*.74),single:Math.max(42,single-3)},
      {time:"8 PM",people:Math.round(base*.92),single:single},
      {time:"9 PM",people:Math.round(base*1.05),single:Math.min(75,single+3)},
      {time:"10 PM",people:Math.round(base*.86),single:Math.min(74,single+1)},
      {time:"11 PM",people:Math.round(base*.62),single:Math.max(40,single-4)}
    ],
    days:[
      ["Monday","Quiet","15–30"],
      ["Tuesday","Quiet","20–35"],
      ["Wednesday","Moderate","30–50"],
      ["Thursday","Busy","50–75"],
      ["Friday","Very busy","80–105"],
      ["Saturday","Very busy","95–125"],
      ["Sunday","Moderate","30–50"]
    ]
  };
}

  frame(`<div class="screen">
    <button class="secondary" onclick="home()">← Back</button>
    <div class="pill" style="margin-top:20px">PREMIUM · NEWCASTLE</div>
    <h1>❤️ Best Newcastle venues for singles tonight</h1>
    <p class="sub">Live and historical venue intelligence based on aggregated anonymous activity.</p>
    <div class="card">${ranking.map((r,i)=>`<div class="card premium-venue-card" style="margin:8px 0">
      <div class="row">
        <div><b style="font-size:18px">${["🥇","🥈","🥉"][i]} ${r.name}</b>
          <div class="muted small">${r.busy} people now · ${r.single}% single</div></div>
        <div style="text-align:right"><div class="big">${r.single}%</div><div class="muted small">single</div></div>
      </div>
      <button class="action" onclick="premiumVenueDetailByName(${JSON.stringify(r.name)})">View venue data →</button>
    </div>`).join("")}</div>
    <div class="card"><b>📊 What Premium unlocks</b>
      <p>❤️ Single vs taken by time</p><p>👥 Historical crowd size</p><p>📅 Friday vs Monday patterns</p><p>📈 Venue trends over time</p><p>🕘 Best times to visit</p>
    </div>
  </div>
${nav("home")}`);
}

function premiumVenueDetailByName(name){
  const v=venues.find(x=>x.name===String(name));
  if(!v){ alert("Venue data is not available yet."); return; }
  premiumVenueDetail(v.name);
}

function premiumVenueDetail(name){
  if(!isPremium()){ premiumPaywall("Venue history & trends"); return; }
  const v=venues.find(x=>x.name===name) || venues[0];
  const d=premiumVenueData(v);
  frame(`<div class="screen">
    <button class="secondary" onclick="premiumSinglesScreen()">← Back</button>
    <div class="pill" style="margin-top:20px">PREMIUM VENUE PROFILE</div>
    <h1>${v.name}</h1><p class="sub">${v.address}</p>
    <div class="card" style="text-align:center"><div class="muted">LIVE NOW</div><div class="big" style="font-size:58px">${d.live}</div><div class="green">● ${d.live>75?"Very busy":d.live>50?"Busy":"Moderate"}</div><p>❤️ ${d.single}% single · 💑 ${d.taken}% taken</p></div>
    <div class="card"><div class="row"><b>📊 Single vs taken by time</b><span class="pill">PREMIUM</span></div>
      ${d.hours.map(x=>`<div class="row" style="padding:11px 0;border-bottom:1px solid #28465b"><span>${x.time}</span><span>${x.people} people</span><b>${x.single}% single</b></div>`).join("")}
    </div>
    <div class="card"><b>📅 Typical weekly pattern</b><p class="muted small">Historical pattern shown once enough anonymous data has been collected.</p>
      ${d.days.map(x=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #28465b"><span><b>${x[0]}</b></span><span>${x[1]}</span><span>${x[2]}</span></div>`).join("")}
    </div>
    <div class="card"><b>🔥 Venue trend</b><p>Friday and Saturday evenings are typically the busiest periods in this prototype.</p><div class="notice">Production version will calculate this from this venue's own historical data.</div></div>
    <div class="card"><b>🔐 Privacy</b><p class="muted small">Premium shows aggregated statistics only. Individual users are never displayed.</p></div>
  </div>${nav("home")}`);
}

// Start the visual app.
welcome();
