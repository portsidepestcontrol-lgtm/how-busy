<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071522">
<title>How Busy?</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071522;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input{font:inherit}button{border:0}.app{min-height:100vh;padding-bottom:82px}.top{padding:18px;padding-top:max(18px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}.logo{font-size:29px;font-weight:900}.y{color:#ffd21a}.tag,.meta,.sub{color:#8fa1b2}.gear{background:#112536;color:#fff;border-radius:50%;width:42px;height:42px}
.search{margin:4px 18px 10px;width:calc(100% - 36px);background:#112536;border:0;border-radius:14px;padding:14px 16px;color:#fff;outline:none}.search::placeholder{color:#8192a3}
.chips{display:flex;gap:8px;overflow:auto;padding:0 18px 12px}.chip{background:#112536;color:#c6d0d9;border-radius:20px;padding:9px 16px;white-space:nowrap}.active{background:#ffd21a!important;color:#111!important;font-weight:800}
.hero{display:flex;justify-content:space-between;align-items:center;padding:4px 18px 8px}.hero h2{font-size:20px;margin:0}.hero p{margin:3px 0;font-size:13px}.mapbtn{background:#1b3042;color:#fff;padding:10px 14px;border-radius:12px}
.legend{display:flex;gap:14px;padding:0 18px 10px;font-size:12px;color:#9caab7}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%}
.card{margin:0 18px 9px;background:#0e2030;border-radius:16px;padding:12px;display:flex;align-items:center;gap:11px;width:calc(100% - 36px);color:#fff;text-align:left}.icon{width:50px;height:50px;border-radius:12px;background:#172d3f;display:grid;place-items:center;font-size:24px}.info{flex:1}.name{font-weight:800;font-size:16px}.meta{font-size:11px;margin-top:3px}.badge{padding:5px 9px;border-radius:10px;color:#071522;font-size:11px;font-weight:900}.pct{text-align:right;font-size:12px;margin-top:4px}
.cta{margin:12px 18px;background:#162b3b;padding:18px;border-radius:16px}.cta b{color:#ffd21a;font-size:18px}.cta p{color:#aebbc7;margin:5px 0 0;font-size:13px}.action{width:100%;padding:16px;border-radius:14px;background:#ffd21a;color:#101820;font-weight:900;margin-top:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:76px;padding-bottom:env(safe-area-inset-bottom);background:#091b2a;border-top:1px solid #1c3141;display:flex;justify-content:space-around;align-items:center}.nav{background:none;color:#718597;font-size:11px;text-align:center}.nav.active{color:#ffd21a}
.screen{padding:18px;padding-top:max(22px,env(safe-area-inset-top));min-height:100vh}.back{background:none;color:#fff;margin-bottom:18px}.title{font-size:29px;font-weight:900;margin:8px 0}.status{margin-top:20px;border:2px solid #ff9d2e;background:#0e2030;border-radius:18px;padding:18px}.small{color:#91a2b1;font-size:11px;font-weight:800}.big{color:#ff9d2e;font-size:28px;font-weight:900;margin-top:6px}.row{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid #1c3141}.label{color:#b5c0ca}.value{font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.report{background:#102334;color:#fff;padding:17px;border-radius:14px}.toast{position:fixed;left:18px;right:18px;bottom:90px;background:#183044;padding:14px;border-radius:13px;text-align:center}
</style>
</head>
<body><div id="app"></div>
<script>
const V=[
{id:1,n:"The Clarendon Hotel",t:"Pub",s:"Hamilton",d:"1.2 km",p:23,l:"Quiet",c:"#21c77a",u:"5 min ago",q:"None"},
{id:2,n:"King Street Hotel",t:"Pub",s:"Newcastle",d:"1.4 km",p:61,l:"Busy",c:"#ff9d2e",u:"3 min ago",q:"Short"},
{id:3,n:"Newcastle Beach Hotel",t:"Pub",s:"Newcastle East",d:"1.6 km",p:92,l:"Packed",c:"#ff4d4d",u:"2 min ago",q:"Long"},
{id:4,n:"The Argyle",t:"Club",s:"Newcastle",d:"2.1 km",p:32,l:"Moderate",c:"#f4c542",u:"7 min ago",q:"None"},
{id:5,n:"D Bar",t:"Bar",s:"The Junction",d:"2.8 km",p:74,l:"Busy",c:"#ff9d2e",u:"4 min ago",q:"Short"}];
let filter="All",search="";
const A=document.getElementById("app");
function bottom(){return `<div class="bottom"><button class="nav active" onclick="home()">⌂<br>Home</button><button class="nav" onclick="map()">◉<br>Map</button><button class="nav" onclick="saved()">♡<br>Saved</button><button class="nav" onclick="premium()">♛<br>Premium</button></div>`}
function home(){let x=V.filter(v=>(filter=="All"||v.t==filter)&&`${v.n} ${v.s}`.toLowerCase().includes(search.toLowerCase()));A.innerHTML=`<div class="app"><div class="top"><div><div class="logo">🍺 How <span class="y">Busy?</span></div><div class="tag">Know before you go.</div></div><button class="gear" onclick="settings()">⚙️</button></div><input class="search" placeholder="Search venues or suburbs..." value="${search}" oninput="search=this.value;home()"><div class="chips">${["All","Pub","Club","Bar"].map(k=>`<button class="chip ${filter==k?"active":""}" onclick="filter='${k}';home()">${k=="All"?"All":k+"s"}</button>`).join("")}</div><div class="hero"><div><h2>Newcastle & Hunter</h2><p class="sub">${x.length} venues nearby</p></div><button class="mapbtn" onclick="map()">🗺 Map</button></div><div class="legend"><span><i class="dot" style="background:#21c77a"></i>Quiet</span><span><i class="dot" style="background:#f4c542"></i>Moderate</span><span><i class="dot" style="background:#ff9d2e"></i>Busy</span><span><i class="dot" style="background:#ff4d4d"></i>Packed</span></div>${x.map(v=>`<button class="card" onclick="venue(${v.id})"><div class="icon">🍻</div><div class="info"><div class="name">${v.n}</div><div class="meta">${v.t} · ${v.d} · ${v.s}</div><div class="meta">Updated ${v.u}</div></div><div><div class="badge" style="background:${v.c}">${v.l}</div><div class="pct">${v.p}%</div></div></button>`).join("")}<div class="cta"><b>Where should I go?</b><p>Find somewhere quiet, busy or packed.</p><button class="action" onclick="where()">Find a venue</button></div>${bottom()}</div>`}
function venue(id){let v=V.find(x=>x.id==id);A.innerHTML=`<div class="screen"><button class="back" onclick="home()">‹ Back</button><div class="icon" style="width:100%;height:180px;font-size:54px">🍻</div><div class="title">${v.n}</div><div class="sub">${v.t} · ${v.s} · ${v.d}</div><div class="status" style="border-color:${v.c}"><div class="small">CURRENT CROWD LEVEL</div><div class="big" style="color:${v.c}">${v.p}% · ${v.l}</div><div class="sub">Last updated ${v.u}</div></div><div class="row"><span class="label">Queue / wait time</span><span class="value">${v.q}</span></div><div class="row"><span class="label">Live music</span><span class="value">Check venue</span></div><button class="action" onclick="report(${id})">Report crowd level</button><button class="action" style="background:#162b3b;color:#fff" onclick="toast('Saved to favourites')">♡ Save venue</button></div>`}
function report(id){A.innerHTML=`<div class="screen"><button class="back" onclick="venue(${id})">‹ Back</button><div class="title">Report crowd level</div><div class="sub">Help other people know before they go.</div><h3>How busy is it?</h3><div class="grid">${["Quiet","Moderate","Busy","Packed"].map(x=>`<button class="report" onclick="send(${id},'${x}')">${x}</button>`).join("")}</div><h3>Queue</h3><div class="grid">${["None","Short","Long"].map(x=>`<button class="report" onclick="send(${id},'${x}')">${x}</button>`).join("")}</div></div>`}
function send(id,x){let v=V.find(y=>y.id==id);v.u="just now";toast("Thanks — report submitted");setTimeout(()=>venue(id),700)}
function map(){A.innerHTML=`<div class="screen"><button class="back" onclick="home()">‹ Back</button><div class="title">Venue map</div><div class="sub">Live GPS/map integration is the next build.</div><div style="margin-top:20px;background:#102334;border-radius:20px;height:60vh;display:grid;place-items:center;text-align:center"><div style="font-size:70px">🗺️</div></div></div>`}
function where(){A.innerHTML=`<div class="screen"><button class="back" onclick="home()">‹ Back</button><div class="title">Where should I go?</div><div class="sub">Tell us what you're after.</div><h3>Crowd level</h3><div class="grid">${["Quiet","Busy","Packed"].map(x=>`<button class="report" onclick="toast('Selected '+x)">${x}</button>`).join("")}</div><h3>Venue type</h3><div class="grid">${["Pubs","Clubs","Bars"].map(x=>`<button class="report" onclick="toast('Selected '+x)">${x}</button>`).join("")}</div><button class="action" onclick="home()">Find venues</button></div>`}
function saved(){A.innerHTML=`<div class="screen"><div class="title">Saved venues</div><div class="sub">Your favourite venues will appear here.</div><button class="action" onclick="home()">Find venues</button></div>`}
function premium(){A.innerHTML=`<div class="screen" style="text-align:center;padding-top:80px"><div style="font-size:50px;color:#ffd21a">♛</div><div class="title" style="color:#ffd21a">Premium</div><div class="sub">More information. Better nights.</div>${["Live crowd information","Crowd history","Find somewhere quiet / busy","Favourite venues","Alerts"].map(x=>`<div class="row" style="text-align:left"><span>✓ ${x}</span></div>`).join("")}<button class="action" onclick="toast('99¢ purchase will be connected in the App Store version')">Get Premium — 99¢</button></div>`}
function settings(){A.innerHTML=`<div class="screen"><button class="back" onclick="home()">‹ Back</button><div class="title">Settings</div>${["Crowd level updates","Favourite venue alerts","Live music events","Special offers","Use my location"].map(x=>`<div class="row"><span>${x}</span><input type="checkbox"></div>`).join("")}</div>`}
function toast(t){let d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
home();
</script></body></html>
